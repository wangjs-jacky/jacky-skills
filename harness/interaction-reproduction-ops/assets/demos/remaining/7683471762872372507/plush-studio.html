<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logoipsum · A little more heart</title><link rel="stylesheet" href="plush-studio.css"><script src="controls.js" defer></script><script src="plush-studio.js" defer></script></head><body><main><section id="studio"><div class="identity"><small>have a fresh idea?</small><h1>imagination<br>meets craft</h1><nav aria-label="Studio"><button data-note="made">Made</button><button data-note="story">Story</button><button data-note="lab">In the lab</button><button id="say-hey">Say hey</button></nav></div><span class="wordmark" aria-label="Logoipsum">Logoipsum</span><div class="invitation"><small>say hey</small><button id="team-up">let’s team up!<br>bring us your idea*</button><p>*good things start with one spark. let’s make yours.</p><div class="socials" aria-hidden="true"><span>▣</span><span>◎</span><span>◉</span></div></div><button id="mascot" aria-label="Give the soft mascot a hug"><span class="plush-art"><img id="plush-image" src="assets/plush-mascot.png" alt="Lavender plush character holding a pink heart" draggable="false"></span><span class="heart-burst" aria-hidden="true"><i>♥</i><i>♥</i><i>♥</i></span></button><p class="hug-instruction">a little more heart.</p></section><footer class="demo-controls"><button id="reset">Reset</button><label><input type="checkbox" id="reduce">Reduce motion</label><p id="state" role="status">Press and hold the mascot, then let go.</p></footer></main><dialog id="hello" aria-labelledby="hello-title"><button id="close-hello" aria-label="Close conversation">×</button><small>HAVE A FRESH IDEA?</small><h2 id="hello-title">Let’s make<br>something lovely.</h2><form id="hello-form" novalidate><label>Your idea<textarea id="message" rows="3" placeholder="Tell us what you have in mind…" required maxlength="280"></textarea></label><button id="preview">Preview note ↗</button><p id="feedback" role="status">Local preview. Nothing is sent.</p></form></dialog><dialog id="story" aria-labelledby="story-title"><button id="close-story" aria-label="Close studio story">×</button><small>IMAGINATION MEETS CRAFT</small><h2 id="story-title"></h2><p id="story-body"></p></dialog></body></html>
