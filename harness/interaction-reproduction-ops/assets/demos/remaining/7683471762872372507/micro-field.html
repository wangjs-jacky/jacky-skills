<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目名称输入框</title><link rel="stylesheet" href="micro-field.css"></head><body><main><form id="project-form" novalidate><div class="field"><label for="project">项目名称</label><input type="text" id="project" name="project" value="my-site" maxlength="32" autocomplete="off" spellcheck="false" aria-describedby="field-note"></div><p id="field-note" role="status" aria-live="polite"> </p></form></main><aside aria-label="演示控制"><button id="confirm" type="submit" form="project-form">确认名称</button><button id="clear" type="button">清空</button><button id="reset" type="button">重新开始</button><label><input type="checkbox" id="reduce"> 减少动态</label><p id="state" role="status" aria-live="polite">本地名称演示，不创建文件；Esc恢复已确认值。</p></aside><script src="controls.js"></script><script src="micro-field.js"></script></body></html>
