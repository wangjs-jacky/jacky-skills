<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper layers · Music posters</title><link rel="stylesheet" href="poster-deck.css"><script src="controls.js" defer></script><script src="poster-deck.js" defer></script></head><body><main><section id="deck-stage" aria-label="Three layered music posters"><div class="deck"><div class="poster rear-third" id="third-poster" aria-hidden="true"><img src="assets/hera-collage.png" alt=""></div><div class="poster rear-metal" id="metal-poster" aria-hidden="true"><img src="assets/metal-can.png" alt=""></div><button class="poster front-poster" id="front-poster" aria-label="Reveal the next poster layers. Drag horizontally, press Enter, or use arrow keys" aria-expanded="false"><span class="poster-brand">HERA<small>◀ SESC ▶</small></span><span class="cloud" aria-hidden="true"></span><img id="record-image" src="assets/flower-record.png" alt="Flower-covered vinyl record with green leaves and a hand touching the centre" draggable="false"><span class="music-label"><span>STUPID GIRL</span><span>GARBAGE</span></span><span class="music-title">YOU WASTED</span></button></div></section><footer class="controls"><button id="reveal">Reveal layers →</button><button id="reset">Reset</button><label><input type="checkbox" id="reduce">Reduce motion</label><p id="state" role="status">A record, a metal tin and a glimpse of another story.</p></footer></main></body></html>
