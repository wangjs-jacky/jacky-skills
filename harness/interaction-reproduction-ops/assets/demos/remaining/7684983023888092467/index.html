<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三端设计规则与完整页面 · 自制复现</title><style>body{margin:0;background:#e8edf2;font:14px -apple-system,BlinkMacSystemFont,sans-serif}header{display:flex;align-items:center;gap:16px;padding:16px 24px;background:white;flex-wrap:wrap}h1{font-size:18px;margin:0}select,button,a{font:inherit;padding:8px;border-radius:8px;border:1px solid #ddd;background:white;color:#333}iframe{width:100%;height:calc(100vh - 82px);min-height:720px;border:0}@media(max-width:720px){header{padding:12px;gap:8px}h1{font-size:14px}iframe{min-height:750px}}</style><header><h1>三端设计规则与完整页面 · 自制复现</h1><select aria-label="选择效果" id="case"><option value="1">01 饮食首页的单一主角、横滑大图卡与一行筛选</option><option value="2">02 同尺寸图片占位与就绪后淡入、不顶动下文</option><option value="3">03 固定毛玻璃底栏、心情日历与可切换拇指区规范</option><option value="4">04 Inventory四级主字阶、网格留白与56像素斑马表格</option><option value="5">05 区分未建数据与筛选无结果的创建引导</option></select><button id="reset">复位</button><label><input type="checkbox" id="reduce">减少动态</label><a id="standalone" href="meal.html?study=hierarchy">独立打开</a></header><iframe title="可操作交互" id="demo" src="meal.html?study=hierarchy&embed=1"></iframe><script>const entries=["meal.html?study=hierarchy","meal.html?study=images","wellness.html?study=thumb","inventory.html?study=grid","inventory.html?study=empty"],frame=document.querySelector('#demo'),choose=document.querySelector('#case');function select(){const n=String(choose.value).padStart(2,'0');const target=new URL(entries[Number(choose.value)-1],location.href);target.searchParams.set("embed","1");frame.src=target.href;document.querySelector('#standalone').href=entries[Number(choose.value)-1];history.replaceState(null,'','#'+n)}choose.onchange=select;document.querySelector('#reset').onclick=()=>frame.contentWindow.postMessage({type:'reset'},'*');const prefs=()=>frame.contentWindow.postMessage({type:'motion-preference',reduced:document.querySelector('#reduce').checked},'*');document.querySelector('#reduce').onchange=prefs;frame.onload=prefs;if(location.hash){choose.value=+location.hash.slice(1);if(choose.value)select()}</script></html>
