<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>八种Dashboard设计 · 自编复现</title><style>body{margin:0;background:#f2f3ed;color:#364633;font:14px/1.7 system-ui}header{padding:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}select,button{max-width:100%;font:inherit;padding:8px;border:1px solid #c4d2b6;border-radius:8px;background:white;color:inherit}a{color:inherit}iframe{display:block;width:100%;height:1100px;border:0}small{color:#6b7968}</style><header><h1>同样的数据，八种阅读重心。</h1><select id="pick" aria-label="选择示例"><option value="reuse.html?case=grind">The Daily Grind · 大色块运营看板</option><option value="travel-photos.html">暖白旅行图片卡流与同图详情</option><option value="storage-glass.html">蓝紫底光玻璃存储看板</option><option value="greenhouse-dense.html">顶部导航与种植高密度卡片墙</option><option value="reuse.html?case=bold">Managing Your Team and Workflows · 荧光点睛</option><option value="weather-editorial.html">气象站杂志排版与浮动胶囊导航</option><option value="health-header.html">深色压顶与奶油健康记录看板</option><option value="buildly-console.html">三档灰暗色控制台与本页方案</option></select><button id="reset">复位</button><label><input type="checkbox" id="reduce">减少动态</label><a id="open" href="reuse.html?case=grind" target="_blank">独立打开 ↗</a><small>六项新方法、两项同款引用；产品操作为自编补写，视觉待评价。</small></header><iframe id="demo" src="reuse.html?case=grind" title="自编交互"></iframe><script>const f=document.querySelector('#demo'),p=document.querySelector('#pick'),r=document.querySelector('#reduce');p.onchange=()=>{f.src=p.value;document.querySelector('#open').href=p.value};document.querySelector('#reset').onclick=()=>f.contentWindow.postMessage({type:'reset'},'*');r.onchange=()=>f.contentWindow.postMessage({type:'motion-prefs',reduced:r.checked},'*');f.onload=()=>r.onchange();</script></html>
