<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>照片空间 · 可操作示例</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#eeeade;color:#4c503d;font:12px system-ui,sans-serif}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:16px;padding:16px 22px;flex-wrap:wrap;border-bottom:1px solid #a9a88855}header b{font-size:13px}select,button{font:inherit;color:inherit;border:1px solid #a9aa8d;border-radius:4px;background:#faf9ef;padding:9px 12px}select{max-width:100%}button{cursor:pointer}label{display:flex;gap:5px;align-items:center;white-space:nowrap}a{color:#606c45;text-decoration:none;border-bottom:1px solid #7f8b6270}output{font-size:10px;color:#87906e}iframe{flex:1;width:100%;border:0;min-height:400px;background:#efede4}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #738e5d;outline-offset:3px}@media(max-width:600px){header{padding:15px 17px;gap:12px}header b{width:100%}select{width:100%}output{width:100%;line-height:1.7}}</style></head><body><header><b>照片空间 · 内外视点</b><select id="pick" aria-label="选择示例"><option value="../7670420512304123136/photo-sphere.html?view=inside">VAULTDOME · 照片内部与外部球体</option><option value="../7670420512304123136/photo-sphere.html">ORBIT · 默认照片球与联系表</option></select><button id="reset">复位当前页</button><label><input id="reduce" type="checkbox"> 减少动态</label><a id="open" href="../7670420512304123136/photo-sphere.html?view=inside" target="_blank" rel="noopener">独立打开 ↗</a><output id="state" role="status">自制可操作页面；技术验证范围与原片差异分别记录。</output></header><iframe id="demo" src="../7670420512304123136/photo-sphere.html?view=inside" title="当前可操作示例"></iframe><script>
(()=>{const pick=document.querySelector('#pick'),frame=document.querySelector('#demo'),input=document.querySelector('#reduce'),mq=matchMedia('(prefers-reduced-motion:reduce)');let external=false;const reduced=()=>input.checked||external||mq.matches,post=data=>frame.contentWindow.postMessage(data,location.protocol==='file:'?'*':location.origin),prefs=()=>post({type:'motion-prefs',reduced:reduced()});pick.addEventListener('change',()=>{const next=pick.value;document.querySelector('#open').href=next;frame.src=next;document.body.dataset.ready='false'});frame.addEventListener('load',()=>{prefs();document.body.dataset.ready='true'});input.addEventListener('change',prefs);mq.addEventListener('change',prefs);document.querySelector('#reset').addEventListener('click',()=>post({type:'reset'}));addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='demo-state'){document.querySelector('#state').textContent=String(e.data.state).slice(0,300);return}if(e.source!==parent||(location.protocol!=='file:'&&e.origin!==location.origin))return;if(['motion-prefs','motion-preference'].includes(e.data?.type)){external=!!e.data.reduced;prefs()}if(['reset','reset-demo'].includes(e.data?.type))post({type:'reset'})});window.room={reduced};})();
</script></body></html>
