<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wandr · 三页旅行规划</title><link rel="stylesheet" href="travel.css"><link rel="stylesheet" href="wandr-app.css"><body><main><div class="phone-wrap"><section class="phone" id="app" aria-label="Wandr旅行规划"><div class="topline"><span>9:41</span><span>⌁ ▰</span></div><section class="app-view" id="view-home"><div class="home-hero"><img src="assets/paris.png" alt="巴黎埃菲尔铁塔"><span class="wordmark">Wandr AI</span><button id="account" aria-label="旅行偏好">♙</button><h1 data-edit="headline">发现旅途之美<br>AI智能规划行程</h1><p data-edit="subheading">专属于你的欧洲旅行灵感</p><form id="search-form"><label class="sr" for="search">目的地</label><span>⌕</span><input id="search" placeholder="你想去哪里？" maxlength="32"><button type="submit" aria-label="规划搜索目的地">☷</button></form></div><button id="plan" class="plan-banner"><b>✣</b><span><strong>AI行程规划</strong><small>几秒钟内创建你的完美行程</small></span><i>↗</i></button><div id="home-scroll"><div class="row-head"><h2>当前行程</h2><button id="all-trips">查看全部</button></div><button id="rome-card" class="trip-card"><img src="assets/rome.png" alt="罗马斗兽场"><span><b data-edit="card-title">罗马，意大利</b><small data-edit="card-description">10天 · 4月15日 – 4月25日</small><i>个人行程</i></span></button><div class="row-head"><h2>探索目的地</h2></div><div class="destination-grid"><button data-dest="圣托里尼，希腊"><img src="assets/santorini.png" alt="圣托里尼"><b>圣托里尼</b></button><button data-dest="巴塞罗那，西班牙"><img src="assets/barcelona.png" alt="巴塞罗那"><b>巴塞罗那</b></button></div></div></section><section class="app-view" id="view-planner" hidden><img class="full-bg" src="assets/santorini.png" alt="圣托里尼海岛"><div class="view-header"><button id="planner-back" aria-label="返回首页">‹</button><span>规划新行程</span></div><header class="place-header"><small>目的地</small><button id="destination"><span id="destination-label">圣托里尼，希腊</span>⌄</button><p>你的 AI 行程即将备妥</p></header><form id="planner-form"><div class="glass-form"><div class="date-field"><span>▦</span><label>旅行日期<div><input id="start-date" type="date" required value="2025-06-12"><span>–</span><input id="end-date" type="date" required value="2025-06-19"></div></label><b id="day-count">7天</b></div><label class="people-field"><span>♧</span><span>旅行人数<input id="adults" type="number" min="1" max="6" required value="2" aria-label="旅行成人数"></span><small>位成人</small></label><fieldset><legend>旅行风格</legend><button type="button" data-style="文化与历史" aria-pressed="true">文化与历史</button><button type="button" data-style="美食探索" aria-pressed="false">美食探索</button><button type="button" data-style="摄影创作" aria-pressed="false">摄影创作</button><button type="button" data-style="休闲放松" aria-pressed="false">休闲放松</button></fieldset><label class="budget-field"><span>▱</span><span>人均预算<strong id="budget-label">15,000 – 25,000</strong><input id="budget" type="range" min="5000" max="40000" step="1000" value="20000" aria-label="人均预算中位数"></span></label><p id="plan-error" role="status"></p></div><button type="submit" class="create-plan">✣ 立即创建行程</button></form></section><section class="app-view" id="view-detail" hidden><img class="detail-bg" src="assets/barcelona.png" alt="巴塞罗那圣家堂"><div class="view-header"><button id="detail-back" aria-label="返回上一页">‹</button><span>AI 为你规划的旅程</span><button id="save-trip" aria-pressed="false" aria-label="保存行程">♡</button></div><header class="detail-header"><small>你的下一段旅程</small><h1 id="detail-name">巴塞罗那，西班牙</h1><p id="plan-summary">3天 · 文化与历史 · 12个地点</p></header><section class="itinerary"><header><h2>行程安排</h2><span>已规划 <b id="station-count">12</b> 站</span></header><div id="days"></div></section><button id="map-button" class="plan-banner"><b>⌖</b><span><strong>查看路线地图</strong><small>12 站串起一段旅程</small></span><i>↗</i></button></section><nav class="wandr-nav" aria-label="主导航"><button id="nav-home" aria-current="page">⌂<small>HOME</small></button><button id="nav-explore">◫<small>EXPLORE</small></button><button id="nav-trips">▤<small>TRIPS</small></button><button id="nav-profile">♙<small>PROFILE</small></button></nav><div class="home-line"></div><dialog id="destination-sheet"><h2>下一站想去哪里？</h2><form id="destination-form"><label>目的地<input id="destination-input" maxlength="40" required></label><p id="destination-error" role="status"></p><footer><button id="destination-cancel" type="button">取消</button><button type="submit" class="lime">确定</button></footer></form></dialog><dialog id="map-sheet"><h2>一条慢慢走的路线</h2><p>行程草案 · 站点示意</p><svg id="route-map" viewBox="0 0 280 300" aria-label="十二站路线示意图"><defs><pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" stroke="#ffffff12" fill="none"/></pattern></defs><rect width="280" height="300" fill="url(#grid)"/><path d="M40 40Q150 15 220 60T180 130T70 150T55 225T210 260" stroke="#c3ef35" stroke-width="3" fill="none"/></svg><p id="map-place"></p><footer><button id="map-close">返回行程</button></footer></dialog><dialog id="place-sheet"><h2 id="place-name"></h2><p id="place-description"></p><footer><button id="place-close">返回行程</button></footer></dialog><dialog id="account-sheet"><h2>让旅程慢下来。</h2><p id="account-copy">偏好保存在本页草案中，规划前可随时调整。</p><footer><button id="account-close">知道了</button></footer></dialog></section></div></main><aside class="demo-controls"><button id="reset">复位</button><label><input type="checkbox" id="reduce">减少动态</label><button id="show-home">首页</button><button id="show-planner">规划页</button><button id="show-detail">原构图行程页</button><p id="state" role="status" aria-live="polite">三页共享同一套变量。创建操作使用本页模板，不调用AI或地图服务。</p></aside><script src="controls.js"></script><script src="wandr-app.js"></script></body></html>
