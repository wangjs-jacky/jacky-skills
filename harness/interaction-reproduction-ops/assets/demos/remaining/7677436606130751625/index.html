<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>从想法到可复用页面 · 旅行App</title><style>body{margin:0;background:#f4f5ef;color:#4c6042;font:13px/1.7 system-ui}header{padding:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{font-size:17px;margin:0}select,button{font:inherit;padding:7px 11px;border:1px solid #d2dcc8;border-radius:15px;background:#fcfdf9;color:inherit;max-width:100%}a{color:inherit}small{color:#93a086}iframe{display:block;width:100%;height:1200px;border:0}</style><header><h1>从想法到可复用页面。</h1><select id="pick" aria-label="选择示例"><option value="fog-cover.html">海边照片、独立航线与可擦雾封面</option><option value="azure-home.html">深色旅行首页的照片主角与分类</option><option value="wandr-app.html">Wandr三页旅行规划与行程联动</option><option value="design-workbench.html">需求、可编辑画板、变量与结构交接</option><option value="journal-existing.html">湖泊旅行手账同款</option><option value="sable-existing.html?view=home">SABLE情绪记录同款</option></select><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label><a id="open" href="fog-cover.html" target="_blank">独立打开 ↗</a><small>四个新方法，两份同款沿原代码；原工具链未执行，视觉待评价。</small></header><iframe id="demo" src="fog-cover.html" title="真实HTML交互"></iframe><script>const f=document.querySelector("#demo"),p=document.querySelector("#pick"),r=document.querySelector("#reduce");p.onchange=()=>{f.src=p.value;document.querySelector("#open").href=p.value};document.querySelector("#reset").onclick=()=>f.contentWindow.postMessage({type:"reset"},"*");r.onchange=()=>f.contentWindow.postMessage({type:"motion-prefs",reduced:r.checked},"*");f.onload=()=>r.onchange();</script></html>
