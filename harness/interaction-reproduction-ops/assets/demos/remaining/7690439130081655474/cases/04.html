<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>习惯墙 · Bento网格</title><link rel="stylesheet" href="../phone.css"><link rel="stylesheet" href="04.css"><script defer src="../phone.js"></script><script defer src="04.js"></script></head><body><main class="stage"><section class="phone"><div id="screen"><header class="wall-header"><span class="wall-avatar"></span><div><b>Hello, 小林</b><small>周一 · 9月28日 · 12个小习惯</small></div><span id="wall-search" class="round"></span><span id="wall-bell" class="round"></span></header><h1>习惯墙 <span class="title-face"></span><br>Habit Wall.</h1><p class="intro">点一下团子就算打卡，再点一下记完成量。</p><div class="wall-week" aria-label="本周日期"><span class="active"><i>•</i><small>一</small><b>28</b></span><span><small>二</small><b>29</b></span><span><small>三</small><b>30</b></span><span><small>四</small><b>1</b></span><span><small>五</small><b>2</b></span><span><small>六</small><b>3</b></span><span><small>日</small><b>4</b></span></div><section class="wall-summary"><div class="summary-top"><div><strong id="completed">8</strong><span>/11</span><p id="summary-note">今日完成 · 还有3个没做 · 1个跳过</p></div><div class="completion-ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40"/><circle id="completion-arc" cx="50" cy="50" r="40"/></svg><b id="percent">73%</b></div></div><div class="mood-bar"><i></i><i></i><i></i><i></i></div><div class="mood-labels"><span>☀ 开心3</span><span>☁ 平静2</span><span>✦ 来劲2</span><span>◡ 硬撑1</span></div><div class="wall-filters" role="group" aria-label="筛选习惯"><button data-filter="all" aria-pressed="true">全部 <b>12</b></button><button data-filter="todo" aria-pressed="false">还没做 <b id="todo-count">3</b></button><button data-filter="done" aria-pressed="false">已完成 <b id="done-count">8</b></button><button data-filter="skip" aria-pressed="false">跳过 <b>1</b></button></div></section><header class="today-heading"><h2>Today <small>习惯墙</small></h2><span>长按记完成量</span></header><section class="habit-grid" aria-label="今日习惯"></section></div><nav class="wall-nav" aria-label="习惯墙导航"><button class="active">▦ <span>习惯墙</span></button><button id="wall-stats" aria-label="查看完成统计">▥</button><button id="wall-list" aria-label="显示全部习惯">☷</button></nav><div id="quantity-sheet" class="sheet" hidden><section class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="quantity-title"><header><h2 id="quantity-title">散步完成量</h2><button class="round" id="close-quantity" aria-label="关闭完成量"></button></header><p>完成量编辑为本版补写；原片只显示长按提示。</p><label>完成量 <input id="quantity" type="number" min="0" max="99999" value="6000"></label><button class="primary" id="save-quantity">保存</button></section></div></section></main><footer class="demo-tools"><button id="reset">重新开始</button><label><input id="reduce" type="checkbox">减少动态</label><span id="state" role="status">点击散步，从8/11变为9/11，支持再次撤回</span></footer></body></html>
