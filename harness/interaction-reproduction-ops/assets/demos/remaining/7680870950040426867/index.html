<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五种高级布局 · 自编复现</title><style>body{margin:0;background:#edf1e9;color:#3b5140;font:13px/1.7 system-ui}header{padding:20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}select,button{font:inherit;padding:8px;background:white;color:inherit;border:1px solid #c7d4be;border-radius:8px}a{color:inherit}iframe{display:block;width:100%;height:1400px;border:0}small{color:#7e9173}</style><header><h1>五种不同的布局秩序</h1><select id="pick" aria-label="选择布局"><option value="forage-stagger.html">FORAGE · 错位食谱与三轴教学</option><option value="vacation-scale.html">Vacation · 大图主导的度假页</option><option value="season-asymmetry.html">Season · 非对称旅行卡片</option><option value="tuanzi-overlap.html">团子的一天 · 层叠照护卡片</option><option value="tuscany-whitespace.html">Tuscany · 留白天气窗口</option></select><button id="reset">复位</button><label><input type="checkbox" id="reduce">减少动态</label><a id="open" href="forage-stagger.html" target="_blank">独立打开 ↗</a><small>真实App构图与教学结构分开；业务为本地补写，视觉相似度待评价。</small></header><iframe id="demo" src="forage-stagger.html" title="自编布局演示"></iframe><script>const f=document.querySelector('#demo'),p=document.querySelector('#pick'),r=document.querySelector('#reduce');p.onchange=()=>{f.src=p.value;document.querySelector('#open').href=p.value};document.querySelector('#reset').onclick=()=>f.contentWindow.postMessage({type:'reset'},'*');r.onchange=()=>f.contentWindow.postMessage({type:'motion-prefs',reduced:r.checked},'*');f.onload=()=>r.onchange();</script></html>
