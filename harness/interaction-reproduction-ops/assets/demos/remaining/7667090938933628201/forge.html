<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'"><title>FORGE · 暖橙火星与空心巨字</title><link rel="stylesheet" href="forge.css"><script defer src="controls.js"></script><script defer src="forge.js"></script><body><header><span>FORGE</span><nav><button data-panel="work">WORK</button><button data-panel="approach">APPROACH</button></nav><button id="open-settings">SPARK SETTINGS ↗</button></header><main><canvas id="embers" width="1200" height="800" role="button" tabindex="0" aria-label="点按放出一簇火星；Enter在中央放火星"></canvas><h1><span>WE</span><strong>FORGE</strong><span>WORLDS</span></h1><p class="caption">WORLD BUILDING. INDEPENDENT THINKING.<br>A SMALL SPARK IS A BEGINNING.</p><div class="transport"><button id="play" aria-pressed="false">流动 8 秒</button><button id="pause">暂停</button><button id="clear">只清除点按火星</button><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label></div></main><footer><p id="state" role="status" aria-live="polite">点按一簇火星。暂停后可以保留它的中间形态。</p><span>SELF-CODED EMBER FIELD / 01</span></footer><p class="source-note">暖橙粒子与三行空心/实心标题来自可见构图；点集、投影、风向、点按火星/有限播放和后续说明均为拟合或补写，不是作者渲染器。</p><dialog id="settings"><button id="close-settings">返回火星 ↗</button><p>FOLLOW A SMALL CURRENT</p><h2>Shape the spark.</h2><label>横向风 <output id="wind-value">0.20</output><input id="wind" aria-label="横向风" type="range" min="-.6" max=".6" step=".01" value=".2"></label><p class="note">风向作用于同一背景点集与点按火星。暂停时间保留，改变参数不会替换画布。</p></dialog><dialog id="info"><button id="close-info">返回火星 ↗</button><p id="info-kicker"></p><h2 id="info-title"></h2><p id="info-copy"></p></dialog></body></html>
