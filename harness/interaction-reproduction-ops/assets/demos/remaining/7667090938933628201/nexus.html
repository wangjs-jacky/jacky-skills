<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'"><title>NEXUS · Think at scale</title><link rel="stylesheet" href="nexus.css"><script defer src="controls.js"></script><script defer src="nexus.js"></script>
<body><header><a class="wordmark" href="#home">NEXUS</a><nav aria-label="主导航"><button data-panel="network">NETWORK</button><button data-panel="protocol">PROTOCOL</button><button data-panel="nodes">NODES</button></nav><button id="join">JOIN MESH ↗</button></header>
<main id="home"><div class="network-wrap"><canvas id="network" width="1200" height="900" tabindex="0" role="button" aria-label="拖动网络球体，方向键转动，Enter查看当前节点，Home复位视角"></canvas></div><section class="hero"><p class="eyebrow">A DISTRIBUTED INTELLIGENCE LAYER</p><h1>Think<br>at <em>scale.</em></h1><p class="intro">把独立的想法，连成可以共同前进的网络。<br>从一个节点开始，探索它与整体的关系。</p></section><div class="scene-controls"><button id="play" aria-pressed="false">转动 12 秒</button><button id="pause">暂停</button><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label></div><p id="state" role="status" aria-live="polite">拖动探索，或选择一个节点。</p></main>
<footer><span>CONNECTED / SELF-CODED STUDY</span><span>ORBITAL SPACE · 01</span><span>SCROLL ↓</span></footer><p class="source-note">独立代码复现 · 点按节点、有限转动与本地加入表单为补写；不连接真实分布式网络。</p>
<dialog id="panel"><button id="close-panel" aria-label="返回网络">返回 ↗</button><p class="eyebrow" id="panel-kicker"></p><h2 id="panel-title"></h2><p id="panel-copy"></p><div id="node-list"></div></dialog>
<dialog id="join-panel"><button id="close-join">返回网络 ↗</button><p class="eyebrow">A LOCAL REQUEST</p><h2>Start with<br><em>one node.</em></h2><form id="join-form"><label>称呼<input id="name" name="name" maxlength="60" required autocomplete="off"></label><label>邮箱<input id="email" name="email" type="email" required maxlength="120" autocomplete="off"></label><button type="submit">保存在本页 ↗</button><output id="join-state">仅本页保存，不会发送。</output></form></dialog>
</body></html>
