<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五种高级审美Dashboard · 可操作方法集</title><style>body{margin:0;background:#f4f1e9;color:#4e4a3f;font:13px/1.7 system-ui}header{padding:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:17px;margin:0}button,select{font:inherit;padding:7px 12px;border:1px solid #d7d0c1;background:#fffdf6;border-radius:18px;max-width:100%}a{color:inherit}small{color:#a19681}iframe{width:100%;height:1200px;border:0;display:block}</style><header><h1>五种Dashboard视觉语言。</h1><select id="pick" aria-label="选择示例"><option value="nixtio-warm.html">Roster · 奶油留白与单黄重点看板</option><option value="grind-existing.html">The Daily Grind · 强对比运营看板同款</option><option value="bold-existing.html">Team & Workflows · 荧光胶囊图表同款</option><option value="sense-frost.html">Sense · 雾面玻璃与完整沉浸工作台</option><option value="travel-existing.html">Elin · 真实图片旅行看板同款</option></select><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label><a id="open" href="nixtio-warm.html" target="_blank">独立打开 ↗</a><small>两新方法、三同款沿原代码；教学/补写分开，视觉待评价。</small></header><iframe id="demo" src="nixtio-warm.html" title="真实HTML交互"></iframe><script>const f=document.querySelector("#demo"),p=document.querySelector("#pick"),r=document.querySelector("#reduce");p.onchange=()=>{f.src=p.value;document.querySelector("#open").href=p.value};document.querySelector("#reset").onclick=()=>f.contentWindow.postMessage({type:"reset"},"*");r.onchange=()=>f.contentWindow.postMessage({type:"motion-prefs",reduced:r.checked},"*");f.onload=()=>r.onchange();</script></html>
