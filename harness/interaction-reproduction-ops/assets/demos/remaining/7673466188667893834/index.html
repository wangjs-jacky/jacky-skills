<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人站 · 四新方法与一同款</title><style>body{margin:0;background:#eef1e9;color:#2f5145;font:13px/1.7 system-ui}header{padding:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:17px;margin:0}button,select{font:inherit;padding:7px 12px;border:1px solid #bdcfc3;background:#f9fff9;border-radius:18px;max-width:100%}a{color:inherit}small{color:#8b9f93}iframe{width:100%;height:1200px;border:0;display:block}</style><header><h1>个人作品站 · 真实自制代码</h1><select id="pick" aria-label="选择示例"><option value="citron.html">CITRON · 圆肖像、弧带与交错作品个人站</option><option value="personal-process.html">个人站材料收拢、职业切换与保留编辑的分步流程</option><option value="cortex.html">CORTEX · 三行双色标题与可读代码终端</option><option value="marchal-existing.html">MARCHAL · 七人物竖栏既有唯一代码</option><option value="strobe.html">STROBE · 保留原节点的主题、文案与项目换位</option></select><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label><a id="open" href="citron.html" target="_blank">独立打开 ↗</a><small>四新方法、一同款原代码；教学/拟合/实际作者执行与审美认可分开。</small></header><iframe id="demo" src="citron.html" title="自制HTML效果"></iframe><script>const f=document.querySelector("#demo"),p=document.querySelector("#pick"),r=document.querySelector("#reduce");p.onchange=()=>{f.src=p.value;document.querySelector("#open").href=p.value};document.querySelector("#reset").onclick=()=>f.contentWindow.postMessage({type:"reset"},"*");r.onchange=()=>f.contentWindow.postMessage({type:"motion-prefs",reduced:r.checked},"*");f.onload=()=>r.onchange();</script></html>
