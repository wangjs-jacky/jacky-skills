<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Superpowers · 七阶段工作流回看</title><link rel="stylesheet" href="workflow.css"><script defer src="../7670420512304123136/controls.js"></script><script defer src="workflow.js"></script><body><main><div class="transport"><button id="play">播放</button><button id="reverse">反向</button><button id="pause">暂停</button><label>回看进度<input type="range" id="timeline" min="0" max="21.2" step=".01" value="14"></label><output id="time">14.00 / 21.20 s</output></div><div class="artboard-wrap"><section class="artboard"><canvas id="particles" width="1080" height="1920" aria-hidden="true"></canvas><div class="purple-field"></div><header class="chapter-heading"><p>SKILL · 02 / 04</p><h1>Superpowers</h1><h2>让 AI 先规划，再动手</h2><span></span></header><pre id="failure-log">&gt; write feature A<br>&gt; tests broken on B<br>&gt; refactor again<br><span>× wrong direction entirely</span></pre><section class="workflow"><h3>七阶段工作流</h3><div class="flow"><div class="flow-item" data-step="0"><button data-stage="0" aria-pressed="true">Brainstorm</button></div><div class="flow-item" data-step="1"><button data-stage="1" aria-pressed="false">Spec</button></div><div class="flow-item" data-step="2"><button data-stage="2" aria-pressed="false">Plan</button></div><div class="flow-item" data-step="3"><button data-stage="3" aria-pressed="false">TDD</button><strong>◉ TEST FIRST</strong></div><div class="flow-item" data-step="4"><button data-stage="4" aria-pressed="false">Build</button></div><div class="flow-item" data-step="5"><button data-stage="5" aria-pressed="false">Review</button></div><div class="flow-item" data-step="6"><button data-stage="6" aria-pressed="false">Finalize</button></div></div><p class="principle">先规划，先写<span>测试</span>，再动手</p></section><p class="source-stars"><span>★</span> <b>170,000</b> <small>STARS</small></p></section></div><section class="workspace"><p class="boundary">教学回看与实际阶段选择分开。这里保留你填写的计划、状态与观察，不安装Superpowers，不执行测试或生成代码。170,000是视频标签。</p><div class="fields"><label>当前阶段<select id="stage-choice"><option value="0">1 · Brainstorm</option><option value="1">2 · Spec</option><option value="2">3 · Plan</option><option value="3">4 · TDD</option><option value="4">5 · Build</option><option value="5">6 · Review</option><option value="6">7 · Finalize</option></select></label><label>本地人工状态<select id="stage-status"><option value="pending">待整理</option><option value="ready">我已准备好</option><option value="held">需要再看</option></select></label></div><form id="note-form"><h2 id="stage-title">Brainstorm</h2><p id="stage-guide"></p><label>此阶段的独立观察<textarea id="note" rows="4" maxlength="700"></textarea></label><div><button type="button" id="restore-note">恢复已存</button><button id="save-note">保留观察</button></div></form><button id="download">下载七阶段本地计划 JSON</button></section></main><footer class="lab"><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label><output id="state" role="status">七个本地阶段；没有执行作者工作流。</output></footer></body></html>
