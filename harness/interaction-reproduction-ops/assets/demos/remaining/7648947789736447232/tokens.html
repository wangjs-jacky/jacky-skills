<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Design System · 色彩、字体与间距</title><link rel="stylesheet" href="tokens.css"><script defer src="../7670420512304123136/controls.js"></script><script defer src="tokens.js"></script><body><main><section class="system" aria-label="设计系统样本"><header><h1>DESIGN SYSTEM</h1><span class="lights"><i></i><i></i><i></i></span></header><div class="section" id="colors-section"><h2>COLOR · 161 套</h2><div class="palette" role="group" aria-label="选择独立颜色"><button data-color="0" aria-label="选择Surface色"><span class="color-name">Surface</span></button><button data-color="1" aria-label="选择Primary色"><span class="color-name">Primary</span></button><button data-color="2" aria-label="选择Accent色"><span class="color-name">Accent</span></button><button data-color="3" aria-label="选择Action色"><span class="color-name">Action</span></button><button data-color="4" aria-label="选择Positive色"><span class="color-name">Positive</span></button><button data-color="5" aria-label="选择Text色"><span class="color-name">Text</span></button></div></div><div class="section type-section" id="type-section"><h2>TYPOGRAPHY · 57 套</h2><div class="specimen"><button class="aa" data-note-key="typography" aria-label="记录字体观察">Aa</button><div><p class="display" id="display-text">Display · Body</p><p class="font-names">Inter · Geist · DM Sans</p></div></div></div><div class="section" id="spacing-section"><h2>SPACING</h2><div class="spacing" role="group" aria-label="选择独立间距"><button data-space="0" aria-label="记录4间距"><span></span><small>4</small></button><button data-space="1" aria-label="记录8间距"><span></span><small>8</small></button><button data-space="2" aria-label="记录16间距"><span></span><small>16</small></button><button data-space="3" aria-label="记录24间距"><span></span><small>24</small></button><button data-space="4" aria-label="记录32间距"><span></span><small>32</small></button><button data-space="5" aria-label="记录48间距"><span></span><small>48</small></button></div></div></section><p class="star-label"><span>★</span> <strong>71,000</strong> <small>STARS</small></p><section class="controls" aria-label="本地参数操作"><div class="control-grid"><label>当前颜色 <input id="color-value" type="color" value="#0f172a"><span class="hex-entry"><input id="color-hex" value="#0f172a" aria-label="当前颜色十六进制" pattern="#[0-9a-fA-F]{6}" maxlength="7" required><button type="button" id="apply-color">应用颜色</button></span></label><label>实际字体搭配<select id="font-choice"><option value="inter-serif">Inter + 系统衬线</option><option value="sans">系统无衬线</option><option value="mono">系统等宽</option></select></label><label>间距倍率 <output id="scale-value">1×</output><input id="spacing-scale" type="range" min=".5" max="2" step=".25" value="1"></label></div><form id="note-form"><p id="selected-name">Surface / 色彩观察</p><label>此项独立观察<textarea id="note" rows="3" maxlength="500"></textarea></label><div><button type="button" id="restore-note">恢复已存</button><button id="save-note">保存观察</button></div></form><p class="boundary">数字与字体名称是来源标签；本页只编辑六个本地颜色和六档间距。实际字体搭配见选择器，不声称加载了Geist/DM Sans或生成161套方案。</p><button id="download">下载本地参数 JSON</button></section></main><footer class="lab"><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label><output id="state" role="status">本地参数样本，不运行作者Skill或修改项目配置。</output></footer></body></html>
