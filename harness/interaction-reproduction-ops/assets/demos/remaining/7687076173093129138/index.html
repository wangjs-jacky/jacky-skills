<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>十主项与前导雪板 · 自制复现</title><style>body{margin:0;background:#e8edf2;font:14px -apple-system,BlinkMacSystemFont,sans-serif}header{display:flex;align-items:center;gap:16px;padding:16px 24px;background:white;flex-wrap:wrap}h1{font-size:18px;margin:0}select,button,a{font:inherit;padding:8px;border-radius:8px;border:1px solid #ddd;background:white;color:#333}iframe{width:100%;height:calc(100vh - 82px);min-height:720px;border:0}@media(max-width:720px){header{padding:12px;gap:8px}h1{font-size:14px}iframe{min-height:750px}}</style><header><h1>十主项与前导雪板 · 自制复现</h1><select aria-label="选择效果" id="case"><option value="1">01 封面飞出、放大翻面与原路返回</option><option value="2">02 沿边缘蓄力的长按确认与未满回退</option><option value="3">03 旋钮磁吸刻度与两位数字独立滚动</option><option value="4">04 同图前后对比的分割裁切</option><option value="5">05 长按展开、滑选释放的弧形菜单</option><option value="6">06 超过阈值后松手执行的滑动确认</option><option value="7">07 长按浮起行与弹簧上下文菜单</option><option value="8">08 目标靠近张开与松手缩小吸入</option><option value="9">09 按住暂停与左右切换的分段故事进度</option><option value="10">10 背景标题随位置同步过渡的3D封面流</option><option value="11">11 按住面板倾斜及跟手光影</option><option value="12">12 同一雪板卡原位撑成整页</option></select><button id="reset">复位</button><label><input type="checkbox" id="reduce">减少动态</label><a id="standalone" href="flip.html">独立打开</a></header><iframe title="可操作交互" id="demo" src="flip.html"></iframe><script>const entries=["flip.html","hold.html","knob.html","compare.html","radial.html","slide.html","context.html","drop.html","story.html","cover.html","board.html#tilt","board.html#expand"],frame=document.querySelector('#demo'),choose=document.querySelector('#case');function select(){const n=String(choose.value).padStart(2,'0');frame.src=entries[Number(choose.value)-1];document.querySelector('#standalone').href=frame.src;history.replaceState(null,'','#'+n)}choose.onchange=select;document.querySelector('#reset').onclick=()=>frame.contentWindow.postMessage({type:'reset'},'*');const prefs=()=>frame.contentWindow.postMessage({type:'motion-preference',reduced:document.querySelector('#reduce').checked},'*');document.querySelector('#reduce').onchange=prefs;frame.onload=prefs;if(location.hash){choose.value=+location.hash.slice(1);if(choose.value)select()}</script></html>
