<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交互细节 · 十二组自编复现</title><style>body{margin:0;background:#f2f3ed;color:#364633;font:14px/1.7 system-ui}header{padding:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}select,button{max-width:100%;font:inherit;padding:8px;border:1px solid #c4d2b6;border-radius:8px;background:white;color:inherit}a{color:inherit}iframe{display:block;width:100%;height:1100px;border:0}small{color:#6b7968}</style><header><h1>让动作有连续的回应。</h1><select id="pick" aria-label="选择示例"><option value="fan-origin.html">FAN · 外置原点扇形卡片</option><option value="inertia-wheel.html">INERTIA · 衰减之后再吸附</option><option value="threshold-sheet.html">SHEET · 位移或速度关闭</option><option value="archive-flight.html">PARABOLA · 两轴飞入归档</option><option value="collapse-title.html">COLLAPSE · 四通道同源标题</option><option value="longpress-reorder.html">REORDER · 长按槽位让位</option><option value="shared-flip.html">FLIP · 同图九宫格展开</option><option value="coalesced-stroke.html">STROKE · 补点与速度笔宽</option><option value="sticky-badge.html">STICKY · 粘连变细与断裂</option><option value="push-pages.html">PUSH · 新旧两页共同位移</option><option value="follow-comparison.html">FOLLOW · 同输入双轮播对照</option><option value="principle-pull.html">三词总览 · 阻力跟随教学</option></select><button id="reset">复位</button><label><input type="checkbox" id="reduce">减少动态</label><a id="open" href="fan-origin.html" target="_blank">独立打开 ↗</a><small>十主章＋双轮播＋三词教学；旁注、拟合、补写分开，视觉待评价。</small></header><iframe id="demo" src="fan-origin.html" title="自编交互"></iframe><script>const f=document.querySelector('#demo'),p=document.querySelector('#pick'),r=document.querySelector('#reduce');p.onchange=()=>{f.src=p.value;document.querySelector('#open').href=p.value};document.querySelector('#reset').onclick=()=>f.contentWindow.postMessage({type:'reset'},'*');r.onchange=()=>f.contentWindow.postMessage({type:'motion-prefs',reduced:r.checked},'*');f.onload=()=>r.onchange();</script></html>
