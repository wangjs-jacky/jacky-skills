<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>品牌资产 · 从标识到界面</title><link rel="stylesheet" href="brand.css"></head><body><main><header><small>BRAND ASSET PROTOCOL</small><h1>品牌资产，<br>贯穿每个细节。</h1><p>把标识、图像、界面与色彩放在同一份清单里。</p></header><div id="protocols"></div><section class="transport"><button id="play">重播四行</button><button id="reverse">反向</button><button id="pause">暂停</button><input id="timeline" type="range" min="0" max="3" step="any" value="3" aria-label="品牌四行入场进度"><output id="clock"></output></section><form id="brand-form"><label>品牌名称 <input id="brand-name" value="Quiet Studio" maxlength="60" required></label><button>保留名称</button></form><div class="preview"><div class="brand-mark" aria-hidden="true">q.</div><div><small>ONE IDENTITY / MANY SURFACES</small><h2 id="brand-title">Quiet Studio</h2><p>从一个细节，延伸出一致的感觉。</p></div></div><footer class="controls"><button id="export">下载资产清单 JSON</button><button id="reset">全部复位</button><label><input id="reduce" type="checkbox">减少动态</label><button id="explain">来源与资产范围</button><span id="state" role="status"></span></footer></main><dialog id="info"><h2>四项协议，四种职责</h2><p>四行粉/蓝/绿/黄标签及入场依据来源画面独立重编。原片没有展示Logo、产品图、界面截图的完整生成链。</p><p>本地文件选择、预览、名称、色彩设置与JSON清单是补写。图片仅在本页读取，不上传；清单只含文件元数据和配色，不包含图片文件或临时URL。没有运行作者自动替换、生成或一致性检测。无默认图片冒充生成成品。</p><button id="close-info">返回资产</button></dialog><script src="../7670420512304123136/controls.js"></script><script src="../7648188804179692815/motion-clock.js"></script><script src="brand.js"></script></body></html>
