<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>时间轴的四种表达</title><link rel="stylesheet" href="motion.css"></head><body><main><header><small>TIME / INTERPOLATION / EASING / SPRITE</small><h1>一条时间轴，四种表达。</h1><p>拖动时间，看看一条线如何变成动作。</p></header><section class="player"><div class="player-label">MOTION STUDY <span>LOCAL / FINITE</span></div><nav class="segments" aria-label="四个运动段"><button data-segment="0">01 useTime</button><button data-segment="1">02 interpolate</button><button data-segment="2">03 Easing</button><button data-segment="3">04 useSprite</button></nav><div class="track"><i id="needle"></i><div class="ticks"><span>0</span><span>2</span><span>4</span><span>6</span><span>8s</span></div></div><p class="preview-label">PREVIEW / <span id="segment-name">TIME</span></p><div id="preview">
<svg id="time-art" viewBox="0 0 640 300" aria-label="连续线轨"><g id="time-lines"><path d="M320 150 L205 95"/><path d="M320 150 L430 148"/><path d="M320 150 L360 235"/></g><circle id="time-dot" r="3" cx="320" cy="150"/></svg>
<div id="interpolate-art" hidden><span class="square reference"></span><span class="square moving"></span></div>
<svg id="easing-art" viewBox="0 0 640 300" aria-label="五种缓动曲线" hidden><g class="guides"><path d="M120 235H525M120 235V55"/></g><g id="curves"><path d="M120 235L525 55"/><path d="M120 235Q180 45 525 55"/><path d="M120 235Q470 235 525 55"/><path d="M120 235C300 235 320 55 525 55"/><path d="M120 235C230 -20 355 100 525 55"/></g><circle id="curve-dot" r="4"/></svg>
<div id="sprite-art" hidden aria-label="六列四行矩阵"></div></div><div class="player-bottom"><span id="pose-label">连续线轨</span><output id="clock">0.00 / 8.00 s</output></div></section>
<section class="transport"><button id="play">播放</button><button id="reverse">反向</button><button id="pause">暂停</button><label class="seek">时间<input id="timeline" type="range" min="0" max="8" step="any" value="0" aria-label="四段运动时间"></label></section><section class="parameters"><label>播放速度 <output id="speed-value">1×</output><input id="speed" type="range" min="0.5" max="2" step="0.25" value="1"></label><label>运动幅度 <output id="amplitude-value">1.0</output><input id="amplitude" type="range" min="0.5" max="1.5" step="0.1" value="1"></label><div class="swatches"><span>强调色</span><button data-color="#c17a52" aria-label="陶土色" aria-pressed="true"></button><button data-color="#a3b791" aria-label="鼠尾草色" aria-pressed="false"></button><button data-color="#84aab6" aria-label="雾蓝色" aria-pressed="false"></button></div></section><footer><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label><button id="explain">关于四段运动</button><span id="state" role="status"></span></footer></main><dialog id="info"><h2>同一时间，不同的表达</h2><p>线轨、双色方块、五条曲线与六列四行矩阵依据可见画面独立重编。8秒时长、曲线、分段和幅度均为本地拟合；四个名称是来源屏幕标签，没有调用其对应库API。</p><p>暂停、反向、滑杆、颜色和取消是补写。本页不生成MP4/GIF/背景音乐，也不将辅助绘制采样声明为自然60fps。</p><button id="close-info">返回运动</button></dialog><script src="../7670420512304123136/controls.js"></script><script src="../7648188804179692815/motion-clock.js"></script><script src="motion.js"></script></body></html>
