<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四种Dashboard · 自编复现</title><style>body{margin:0;background:#e9ede7;color:#3b5140;font:13px/1.7 system-ui}header{padding:20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}select,button{font:inherit;padding:8px;background:white;color:inherit;border:1px solid #c7d4be;border-radius:8px}a{color:inherit}iframe{display:block;width:100%;height:1200px;border:0}small{color:#7e9173}</style><header><h1>四种不同构图的工作台</h1><select id="pick" aria-label="选择Dashboard"><option value="stage-business.html">Switchyard · 分段商务拍摄工作台</option><option value="practice-airy.html">练习日历 · 三栏轻量工作台</option><option value="grind-dark.html">The Daily Grind · 多地点运营看板</option><option value="workflows-bold.html">Team &amp; Workflows · 荧光分段柱工作台</option></select><button id="reset">复位</button><label><input type="checkbox" id="reduce">减少动态</label><a id="open" href="stage-business.html" target="_blank">独立打开 ↗</a><small>自编本地业务；原效果相似度待评价。</small></header><iframe id="demo" src="stage-business.html" title="自编Dashboard"></iframe><script>const f=document.querySelector('#demo'),p=document.querySelector('#pick'),r=document.querySelector('#reduce');p.onchange=()=>{f.src=p.value;document.querySelector('#open').href=p.value};document.querySelector('#reset').onclick=()=>f.contentWindow.postMessage({type:'reset'},'*');r.onchange=()=>f.contentWindow.postMessage({type:'motion-prefs',reduced:r.checked},'*');f.onload=()=>r.onchange();</script></html>
