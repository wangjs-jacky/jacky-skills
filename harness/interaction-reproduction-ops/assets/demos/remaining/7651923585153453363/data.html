<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'"><title>数据大屏 · 四页与独立指标</title><link rel="stylesheet" href="data.css"><script defer src="../7670420512304123136/controls.js"></script><script defer src="data.js"></script></head><body data-mode="dashboard"><main><header class="masthead"><small>DATA VISUALIZATION / 02</small><h1>数据大屏</h1><p>深色底搭数据图表，KPI一眼看清</p></header><section class="presentation" aria-label="数据大屏演示"><div id="deck-size"><div id="deck" tabindex="0" role="group" aria-label="四页数据幻灯片，可用方向键翻页"></div></div></section><section id="kpis" aria-label="独立外部指标"></section><nav id="pages" aria-label="页面选择"></nav><section class="actions"><button id="play">顺序播放</button><button id="reverse">反向播放</button><button id="pause" disabled>暂停</button><button id="edit">当前页笔记</button><button id="reset">全部复位</button><label><input id="reduce" type="checkbox">减少动态</label></section><p id="state" role="status" aria-live="polite">固定教学数据。图表可选择条目和切换系列。</p><details><summary>来源与实现说明</summary><p>四页分别为主题金球、四指标、采纳率横条和双增长线；外部KPI、扫描线与页序独立。屏显数字仅来自作者演示，不是实时统计。SVG、排版、曲线和计时为自编拟合，输入与交互为补写；未运行作者Skill或生成服务。</p></details></main><dialog id="editor"><form id="note-form"><header><span id="note-label"></span><button type="button" id="close-edit">返回 ×</button></header><h2>保留这一页的想法。</h2><label>当前页笔记<textarea id="note" maxlength="160" rows="4" required></textarea></label><p>仅保留在当前页面内存，不上传。</p><button type="submit">保存笔记</button><button type="button" id="cancel-edit">取消</button></form></dialog></body></html>
