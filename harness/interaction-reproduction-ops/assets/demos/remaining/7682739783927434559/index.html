<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五种交互 · 自编复现</title><style>body{margin:0;background:#121920;color:#dce6ed;font:13px/1.7 system-ui}header{padding:20px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}h1{font-size:17px;margin:0}a{color:inherit}select,button{font:inherit;color:inherit;background:#23333e;border:1px solid #3d535f;border-radius:7px;padding:8px}iframe{width:100%;height:980px;border:0;display:block}small{color:#8c9eaa}</style><header><h1>五种交互，自编复现</h1><select id="pick" aria-label="选择案例"><option value="button-feedback.html">1 · 按钮状态驱动沿边反馈</option><option value="focus-room.html">2 · Focus Room整组数字滚动与独立进度</option><option value="discover-entry.html">3 · Discover四层错峰入场</option><option value="card-depth.html">4 · 彩色三卡尺寸位置与前后层次</option><option value="natural-stop.html">5 · 横向胶囊完成周期减速归位</option></select><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label><a id="open" href="button-feedback.html" target="_blank">独立打开 ↗</a><small>参数为拟合，操作验证与视觉评价分开。</small></header><iframe id="demo" title="可操作自编示例" src="button-feedback.html"></iframe><script>const f=document.querySelector('#demo'),p=document.querySelector('#pick'),reduce=document.querySelector('#reduce');p.onchange=()=>{f.src=p.value;document.querySelector('#open').href=p.value};document.querySelector('#reset').onclick=()=>f.contentWindow.postMessage({type:'reset'},'*');reduce.onchange=()=>f.contentWindow.postMessage({type:'motion-prefs',reduced:reduce.checked},'*');f.onload=()=>reduce.onchange();</script></html>
