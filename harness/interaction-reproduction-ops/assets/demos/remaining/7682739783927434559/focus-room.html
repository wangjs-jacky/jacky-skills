<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Room · text in motion</title><link rel="stylesheet" href="focus-room.css"><script src="controls.js" defer></script><script src="focus-room.js" defer></script></head><body><main><header class="intro"><p>TEXT MOTION</p><h1>A small change, a little rhythm.</h1></header><section class="focus-card" aria-label="Focus Room"><header class="room-heading"><span class="avatar">N</span><div><p>TONIGHT</p><h2>Focus Room</h2></div></header><div class="metric" id="metric" tabindex="0" role="group" aria-label="12 users; arrow keys to change the example"><div id="number" class="roller" aria-hidden="true"><span class="roll-layer">12</span><span class="roll-layer">13</span></div><span class="unit">users</span></div><output id="value-announcement" class="sr-only" aria-live="polite">12 users</output><div class="progress-row"><div id="gain" class="gain roller" aria-label="Plus 3 today"><span class="roll-layer">+3 today</span><span class="roll-layer">Live now</span></div><div id="progress" class="progress" role="progressbar" aria-label="Example room activity" aria-valuemin="0" aria-valuemax="100" aria-valuenow="28"><i id="fill"></i></div></div><div class="tags" aria-label="Room information"><span>Deep</span><span>90 min</span><span>Silent</span></div></section><footer class="controls"><button id="replay">Play 12 → 15</button><button id="minus" aria-label="Remove one example user">−</button><button id="plus" aria-label="Add one example user">+</button><button id="status-toggle">Change status text</button><button id="cancel">Cancel motion</button><button id="reset">Reset</button><label><input type="checkbox" id="reduce">Reduce motion</label><p id="state" role="status">Local sample data. The number and progress keep their own rhythm.</p></footer></main></body></html>
