<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Button feedback · one turn and a loading state</title><link rel="stylesheet" href="button-feedback.css"><script src="controls.js" defer></script><script src="button-feedback.js" defer></script></head><body><main><header><p>BUTTON FEEDBACK</p><h1>A little light. A clear state.</h1></header><div class="samples"><section class="sample" aria-label="Single action feedback"><div class="ghost-lines" aria-hidden="true"><i></i><i></i></div><button id="once" class="action"><span>Submit</span><svg viewBox="0 0 224 60" preserveAspectRatio="none" aria-hidden="true"><rect x="1.5" y="1.5" width="221" height="57" rx="18.5" pathLength="100"/></svg></button><p class="sample-note">one action · one turn</p></section><section class="sample" aria-label="Loading feedback"><div class="ghost-lines" aria-hidden="true"><i></i><i></i></div><button id="loading" class="action" aria-busy="true" aria-disabled="true"><span>Loading</span><svg viewBox="0 0 224 60" preserveAspectRatio="none" aria-hidden="true"><rect x="1.5" y="1.5" width="221" height="57" rx="18.5" pathLength="100"/></svg></button><p class="sample-note">loading · the ring keeps moving</p></section></div><div class="captions"><p>Single action</p><p>While loading</p></div><footer class="controls"><button id="cancel-once">Cancel feedback</button><button id="start-loading">Start loading</button><button id="complete-loading">Complete loading</button><button id="cancel-loading">Cancel loading</button><button id="reset">Reset</button><label><input type="checkbox" id="reduce">Reduce motion</label><p id="state" role="status">The right-hand button is a local loading simulation. No request is sent.</p></footer></main></body></html>
