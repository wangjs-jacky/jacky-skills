<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Layers · a little depth</title><link rel="stylesheet" href="card-depth.css"><script src="controls.js" defer></script><script src="card-depth.js" defer></script></head><body><main><header><p>CARD DEPTH</p><h1>A little depth.</h1><span>One card in focus. Two waiting behind.</span></header><section class="stage" aria-label="Three layered cards"><div id="deck" tabindex="0" role="group" aria-label="Card stack. Use left and right arrow keys."><article class="card blue" aria-label="Blue card"><div class="color"></div><div class="copy"><i></i><i></i></div></article><article class="card purple" aria-label="Purple card"><div class="color"></div><div class="copy"><i></i><i></i></div></article><article class="card yellow" aria-label="Yellow card"><div class="color"></div><div class="copy"><i></i><i></i></div></article></div></section><div class="browse"><button id="previous" aria-label="Previous card">←</button><span id="position" aria-live="polite">01 / 03</span><button id="next" aria-label="Next card">→</button></div><footer class="controls"><button id="reset">Reset</button><label><input type="checkbox" id="reduce">Reduce motion</label><p id="state" role="status">Blue card in front. Drag horizontally, or use the arrows.</p></footer></main></body></html>
