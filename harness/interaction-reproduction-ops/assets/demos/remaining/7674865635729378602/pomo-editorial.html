<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pomo · 极简编辑专注台</title><link rel="stylesheet" href="mobile.css"><link rel="stylesheet" href="pomo-editorial.css"><body><main class="desk"><div class="phone-wrap"><section class="phone pomo-phone" aria-label="Pomo专注台"><div class="status"><b>9:41</b><span>▮▮▮ ◔ ▰</span></div><div class="pomo-scroll" id="pomo-scroll"><header class="pomo-header"><div><h1>Pomo</h1><p>FOCUS DESK</p></div><button id="speed" aria-pressed="true">● x20 演示</button></header><button id="task-open"><span>•</span><strong id="task-title">整理Q3提案的结构</strong><small id="task-index">1 / 3</small><span>⌄</span></button><div class="modes" role="tablist" aria-label="计时模式"><button data-mode="focus" role="tab" aria-selected="true">专注 <span>25</span></button><button data-mode="short" role="tab" aria-selected="false">短歇 <span>05</span></button><button data-mode="long" role="tab" aria-selected="false">长歇 <span>15</span></button></div><div class="dial" id="dial" role="slider" tabindex="0" aria-label="专注时长，分钟" aria-valuemin="1" aria-valuemax="60" aria-valuenow="25"><svg viewBox="0 0 300 300" aria-hidden="true"><g id="ticks"></g><circle id="knob-halo" r="12"/><circle id="knob" r="5"/></svg><div class="time"><span id="minutes">25</span><i>:</i><span id="seconds">00</span></div><p id="mode-label">DEEP FOCUS</p><small id="dial-hint">按住外圈刻度可以拨时长</small></div><div class="timer-actions"><button id="restart" aria-label="重置当前计时">↶</button><button id="start"><span>▶</span> <b>开始专注</b></button><button id="skip" aria-label="结束当前一段并记录">▹|</button></div><header class="sound-title"><h2>声场</h2><span>SYNTHESIZED LIVE</span></header><section class="sound-panel"><div class="sounds" aria-label="合成声场"><button data-sound="rain" aria-pressed="false">雨</button><button data-sound="forest" aria-pressed="false">林</button><button data-sound="cafe" aria-pressed="false">咖啡馆</button><button data-sound="silent" aria-pressed="true">静</button></div><p id="sound-state">未开声场</p></section></div><nav class="pomo-nav" aria-label="专注台导航"><button data-nav="focus" aria-current="page"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M9 1h6M12 5V3M12 9v5l3 2"/></svg>专注</button><button data-nav="tasks"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m2 6 2 2 3-4M10 6h12M2 13l2 2 3-4M10 13h12M2 20l2 2 3-4M10 20h12"/></svg>任务</button><button data-nav="stats"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 22V12M10 22V5M16 22V9M22 22V1"/></svg>统计</button><button data-nav="profile"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></svg>我</button></nav></section></div><div class="tools"><button id="reset">复位</button><label><input type="checkbox" id="reduce"> 减少动态</label></div><output id="state" aria-live="polite"></output><p class="footnote">时长拨盘、计时记录与合成声场为本地补写；x20可切回真实速度。</p></main><dialog class="sheet pomo-sheet" id="info"><h2 id="info-title"></h2><div id="info-body"></div><footer><button id="close-info">返回专注</button></footer></dialog><dialog class="sheet pomo-sheet" id="task-editor"><form id="task-form"><h2>添加专注任务</h2><label>任务名称<input id="new-task" maxlength="80" required autocomplete="off"></label><p id="task-error" class="error"></p><footer><button type="button" id="cancel-task">取消</button><button type="submit">添加任务</button></footer></form></dialog><script src="controls.js"></script><script src="pomo-editorial.js"></script></body></html>
