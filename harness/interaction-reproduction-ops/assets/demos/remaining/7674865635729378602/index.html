<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五种移动端视觉语言 · 可操作方法集</title><style>body{margin:0;background:#f4f1e9;color:#4e4a3f;font:13px/1.7 system-ui}header{padding:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:17px;margin:0}button,select{font:inherit;padding:7px 12px;border:1px solid #d7d0c1;background:#fffdf6;border-radius:18px;max-width:100%}a{color:inherit}small{color:#a19681}iframe{width:100%;height:1150px;border:0;display:block}</style><header><h1>五种移动端视觉语言。</h1><select id="pick" aria-label="选择示例"><option value="image-first.html">Image First · 大图旅行卡与邻卡露边</option><option value="card-rhythm.html">默 · 大封面、续读与列表节奏</option><option value="today-existing.html">今天，是什么颜色的？ · 大字留白同款</option><option value="nova-atmosphere.html">NOVA 星桥 · 图底与玻璃看板</option><option value="pomo-editorial.html">Pomo · 陶红拨盘与极简专注台</option></select><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label><a id="open" href="image-first.html" target="_blank">独立打开 ↗</a><small>四个新方法、一份同款沿原代码；原片教学/补写分开，视觉待评价。</small></header><iframe id="demo" src="image-first.html" title="真实HTML交互"></iframe><script>const f=document.querySelector("#demo"),p=document.querySelector("#pick"),r=document.querySelector("#reduce");p.onchange=()=>{f.src=p.value;document.querySelector("#open").href=p.value};document.querySelector("#reset").onclick=()=>f.contentWindow.postMessage({type:"reset"},"*");r.onchange=()=>f.contentWindow.postMessage({type:"motion-prefs",reduced:r.checked},"*");f.onload=()=>r.onchange();</script></html>
