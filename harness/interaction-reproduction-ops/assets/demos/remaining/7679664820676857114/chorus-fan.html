<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chorus · 同一手牌，两种排布</title><link rel="stylesheet" href="chorus-fan.css"><script defer src="controls.js"></script><script defer src="chorus-fan.js"></script></head>
<body><main>
<div class="page-heading"><span>CHORUS / A HAND OF CARDS</span><span>靠近看画，点击翻面，切换 Fan / Wall。</span></div>
<section class="product-stage" id="chorus-stage" aria-label="十六张画卡的可操作扇形画廊">
<header><span class="chorus-brand"><i aria-hidden="true">▥</i> CHORUS</span><span>FAN DECK / CLICK TO FLIP</span></header>
<div class="title"><p>002 — A HAND OF CARDS</p><h1>Every card, <em>face up</em></h1></div>
<div id="card-board" aria-label="画卡，方向键切换，Enter翻面，Escape返回"></div>
<div class="floor-shadow" aria-hidden="true"></div>
<div class="mode-picker" role="group" aria-label="画卡排布"><button id="layout-fan" aria-pressed="true">Fan</button><button id="layout-wall" aria-pressed="false">Wall</button></div>
<div id="plate-index" aria-label="选择十六张画卡"></div>
<p class="deck-footnote">16 PLATES · ALWAYS DEALING · CLICK TO FLIP · HOVER TO KNOW</p>
</section>
<div class="tools"><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label><label><input id="teaching" type="checkbox">原片教学排布对照</label><output id="state" aria-live="polite" role="status"></output></div>
<p class="provenance" id="layout-note">产品是16张同节点画卡，在扇形和双行图墙之间连续重排。4.5°教学/180°沿旁注；产品3.8°步距、尺寸/曲线拟合，背面文字和手机四列布局补写；素材为独立画作。</p>
</main></body></html>
