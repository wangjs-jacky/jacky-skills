<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六种Web交互 · 自编复现</title><style>body{margin:0;background:#f2f3ed;color:#364633;font:14px/1.7 system-ui}header{padding:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}select,button{max-width:100%;font:inherit;padding:8px;border:1px solid #c4d2b6;border-radius:8px;background:white;color:inherit}a{color:inherit}iframe{display:block;width:100%;height:1100px;border:0}small{color:#6b7968}</style><header><h1>让图片拥有空间与回应。</h1><select id="pick" aria-label="选择示例"><option value="reverse-rails.html">Quorum · 反向图带与三图回应</option><option value="chorus-fan.html">Chorus · 十六卡翻面与归档墙</option><option value="cylinder-reel.html">Splay · 筒内卡带与速度散字</option><option value="parade-ring.html">Parade · 环外画廊与双行归档墙</option><option value="continuum-band.html">Continuum · 半扭转胶片与同图看板</option><option value="vector-tunnel.html">Vector · 独立深度的纵深隧道</option></select><button id="reset">复位</button><label><input type="checkbox" id="reduce">减少动态</label><a id="open" href="reverse-rails.html" target="_blank">独立打开 ↗</a><small>六项自制复现；旁注、拟合与补写分开，视觉待评价。</small></header><iframe id="demo" src="reverse-rails.html" title="自编交互"></iframe><script>const f=document.querySelector('#demo'),p=document.querySelector('#pick'),r=document.querySelector('#reduce');p.onchange=()=>{f.src=p.value;document.querySelector('#open').href=p.value};document.querySelector('#reset').onclick=()=>f.contentWindow.postMessage({type:'reset'},'*');r.onchange=()=>f.contentWindow.postMessage({type:'motion-prefs',reduced:r.checked},'*');f.onload=()=>r.onchange();</script></html>
