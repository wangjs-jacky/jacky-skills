<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vector · 纵深隧道</title><link rel="stylesheet" href="vector-tunnel.css"><script defer src="controls.js"></script><script defer src="vector-tunnel.js"></script></head><body><main><div class="page-heading"><span>VECTOR / HEAD-ON</span><span>滚轮或上下拖动穿行，反向输入就沿来路退回。</span></div><section class="tunnel-shell"><header><b>▣ VECTOR</b><nav aria-label="纵深方向"><button id="forward" aria-pressed="false">forward</button><button id="hold" aria-pressed="true">hold</button><button id="back" aria-pressed="false">back</button></nav></header><div id="tunnel-camera" tabindex="0" aria-label="纵深画廊，上下拖动或滚轮穿行；左右键调整，Home/End到边界"><div id="tunnel-world"></div></div><h1>Head-on, <em>one<br>after another</em></h1><div class="tunnel-caption"><small>PLATE <span id="plate-no">01</span></small><span id="plate-name">Study 01</span></div><footer><span>VECTOR</span><span id="z-position">Z / 0</span><span>DRAG · WHEEL · KEYS</span></footer></section><div class="tools"><button id="reset">复位</button><label><input id="teaching" type="checkbox">查看透视公式</label><label><input id="reduce" type="checkbox">减少动态</label><output id="state" role="status" aria-live="polite"></output></div><section class="teaching" hidden><div><h2>scale = d / (d − z)</h2><p>d = 600；下方单图只作公式教学，产品由22张独立深度图组成。</p><label>Z <input id="depth" type="range" min="-600" max="450" step="1" value="0"><output id="depth-value">0 · scale 1.00</output></label></div><div class="formula-camera"><img id="formula-image" src="assets/umber-study.png" alt="自制画作的单图透视教学"></div></section><p class="provenance">独立z、共同增量、前后穿行和透视公式沿原画。22张/240px层距/相机/速度/有限边界为拟合；触摸取消、键盘、减少动态与公式输入为补写。点击大图为本地扩展，未见原片完整过程。</p><dialog id="image-dialog" aria-label="本地扩展：查看原图"><button id="close-image">关闭，回到原位</button><div id="viewer-image"></div></dialog></main></body></html>
