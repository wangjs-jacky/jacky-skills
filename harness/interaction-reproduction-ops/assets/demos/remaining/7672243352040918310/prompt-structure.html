<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt optimizer · 把要求写清楚</title><link rel="stylesheet" href="prompt-structure.css"><body><main><header><span class="number">03</span><div><h1>prompt-optimizer <small>LOCAL STUDY</small></h1><p>SAY IT RIGHT <i>·</i> 优化表达</p></div></header><section class="comparison"><article class="before"><span>原始描述</span><p id="before-copy">做一个作品页面</p></article><article class="after"><span>结构化要求</span><ul id="requirements"><li><i></i><b>角色</b><span id="role-copy"></span></li><li><i></i><b>目标</b><span id="goal-copy"></span></li><li><i></i><b>约束</b><span id="limits-copy"></span></li><li><i></i><b>输出</b><span id="format-copy"></span></li></ul></article><div class="before-result"><b>BEFORE</b><div class="placeholder"><i></i><i></i></div><small id="before-length">7 字符 · 未进行语义评分</small></div><div class="after-result"><b>AFTER</b><div class="placeholder"><i></i><i></i><i></i></div><span id="check" aria-hidden="true">✓</span><small id="requirement-count">4 / 4 项已填写</small></div></section><div class="playback"><button id="replay">重播结构图示</button><button id="pause" disabled>暂停</button><button id="cancel">取消</button><output id="playback-state" role="status">四条要求已就绪</output></div><p class="disclosure">本地编辑与规则整理演练。下方灰蓝条是对比图示，没有运行作者 Skill、模型或前后生成评测。</p><section class="editor"><h2>补充自己的任务细节。</h2><form id="prompt-form"><label>原始描述<textarea id="raw" required maxlength="1200" rows="3">做一个作品页面</textarea></label><div class="fields"><label>角色<input id="role" required maxlength="100" value="网页设计顾问"></label><label>目标<textarea id="goal" required maxlength="600" rows="3">让读者找到作品和联系入口。</textarea></label><label>约束<textarea id="limits" required maxlength="600" rows="3">支持手机、键盘与减少动态。</textarea></label><label>输出形式<textarea id="format" required maxlength="600" rows="3">可操作HTML，附验证结果与差异。</textarea></label></div><button type="submit">应用当前要求 →</button><output id="form-result" role="status">使用自行撰写的示例字段，可直接编辑。</output></form></section><section class="output"><div><button id="show-output" aria-expanded="false">查看完整自写要求 ↓</button><button id="copy">复制</button><button id="download">下载 TXT</button></div><textarea id="prompt-output" readonly hidden aria-label="完整自写复用要求"></textarea><output id="copy-result" role="status">复制与下载的是当前已应用的字段。</output></section><footer><span>SELF-CODED STUDY / 结构齐备不等于模型效果更好</span><button id="reset">复位</button><label><input id="reduce" type="checkbox"> 减少动态</label><output id="state" aria-live="polite"></output></footer></main><script src="controls.js"></script><script src="prompt-structure.js"></script></body></html>
