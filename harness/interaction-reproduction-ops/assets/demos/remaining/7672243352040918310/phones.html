<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三手机 · 原片结果组合</title><link rel="stylesheet" href="phones.css"><body><main><header><p>UI PRE CHECK / RESULT STUDY</p><h1>三个页面，<br><em>各有自己的视觉语言。</em></h1><span>真实 HTML 组合 / 原片仅静态展示，切换操作为本地补写</span></header><section class="phones" id="stage" aria-label="三手机真实页面"><div id="rig"><div class="device" data-device="0"><iframe id="shanghai" title="上海徐汇天气"></iframe><span>SHANGHAI / WEATHER</span></div><div class="device selected" data-device="1"><iframe id="tuanzi" title="团子的一天既有唯一实现"></iframe><span>TUANZI / CARE</span></div><div class="device" data-device="2"><iframe id="london" title="London插画天气"></iframe><span>LONDON / WEATHER</span></div></div></section><div class="choices" aria-label="选择前景页面"><button data-pick="0" aria-pressed="false">上海徐汇</button><button data-pick="1" aria-pressed="true">团子的一天</button><button data-pick="2" aria-pressed="false">London</button></div><p class="note">两张天气页为自编复现，团子看板沿既有唯一源码；原片文字、遮挡和素材差异见私有记录。三个 iframe 保持原节点与文档，切换不会重新加载。</p><footer><button id="reset">复位三页面</button><label><input id="reduce" type="checkbox"> 减少动态</label><output id="state" role="status"></output></footer></main><script src="controls.js"></script><script src="phones.js"></script></body></html>
