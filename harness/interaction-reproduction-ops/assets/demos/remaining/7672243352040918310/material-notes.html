<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Summarize · 四类材料与三条笔记</title><link rel="stylesheet" href="material-notes.css"><body><main><header><span class="number">02</span><div><h1>summarize <small>LOCAL STUDY</small></h1><p>FEED IT <i>·</i> 整理信息</p></div></header><section class="diagram" aria-label="资料与笔记图示"><div class="input-flow"><div class="source-tabs" role="group" aria-label="资料类型"><button data-kind="0" aria-pressed="true">网页</button><button data-kind="1" aria-pressed="false">视频</button><button data-kind="2" aria-pressed="false">播客</button><button data-kind="3" aria-pressed="false">文件</button></div><svg class="funnel" viewBox="0 0 520 200" aria-hidden="true"><defs><linearGradient id="funnel-fill" x2="0" y2="1"><stop stop-color="#f8c62b" stop-opacity=".27"/><stop offset="1" stop-color="#f8c62b" stop-opacity=".04"/></linearGradient></defs><path d="M25 15H495L300 132V169H220V132Z" fill="url(#funnel-fill)" stroke="#d8b62b" stroke-width="2"/><path id="flow-line" d="M260 20V184" fill="none" stroke="#ffe07a" stroke-width="2"/></svg><div id="notes"><button data-note="0"><i></i><b>主要观点</b><span id="result-0">还没有保存笔记</span></button><button data-note="1"><i></i><b>关键数字</b><span id="result-1">还没有保存笔记</span></button><button data-note="2"><i></i><b>下一步</b><span id="result-2">还没有保存笔记</span></button></div></div><aside class="time-study"><p>阅读对比图示</p><div class="bar-track"><div id="time-bar"></div></div><strong id="time-label">40:00</strong><small id="time-note">自填阅读基准</small><div><button id="play">重播图示</button><button id="pause" disabled>暂停</button><button id="cancel">取消图示</button></div></aside></section><p class="disclosure">漏斗与时间变化是教学演练；笔记由你填写。没有联网采集、自动转录、PDF 解析或调用 summarize Skill，也不代表效率实测。</p><section class="editor"><div class="editor-head"><h2 id="editor-title">网页 · 整理一份自己的材料</h2><span id="save-count">0 / 4 份已保存</span></div><form id="note-form"><label>材料名称<input id="material-title" required maxlength="100" placeholder="例如：作品页面的观察"></label><label>已取得的文本片段<textarea id="material-text" maxlength="12000" rows="4" placeholder="贴入已有文本；或导入本机 TXT / Markdown"></textarea></label><label class="upload">导入纯文本<input id="material-file" type="file" accept=".txt,.md,text/plain,text/markdown"></label><output id="file-result" role="status">只读取你选择的本机纯文本文件，最大 256 KB。</output><div class="note-fields"><label>主要观点<textarea id="point" required maxlength="600" rows="3"></textarea></label><label>关键数字<textarea id="data" required maxlength="600" rows="3"></textarea></label><label>下一步<textarea id="action" required maxlength="600" rows="3"></textarea></label></div><label class="reading">阅读基准（分钟）<input id="reading" type="number" required min="1" max="120" step="1" value="40"></label><div class="form-actions"><button type="button" id="discard">放弃未保存编辑</button><button type="submit">保存三条笔记 →</button></div><output id="save-result" role="status">尚未保存。</output></form></section><section class="saved"><button id="download">下载四类笔记 JSON ↓</button><output id="selected-note" role="status">选择上方一条笔记，可在这里读完整内容。</output></section><footer><span>SELF-CODED NOTES / 内容由本页输入，不是模型摘要结果</span><button id="reset">复位</button><label><input id="reduce" type="checkbox"> 减少动态</label><output id="state" aria-live="polite"></output></footer></main><script src="controls.js"></script><script src="material-notes.js"></script></body></html>
