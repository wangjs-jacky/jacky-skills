<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI 前置 · 先做设计决策</title><link rel="stylesheet" href="ui-precheck.css"><body><main><header><span class="number">05</span><div><h1>我整理的 UI Skill 前置 <small>LOCAL STUDY</small></h1><p>PRE CHECK · 设计决策</p></div></header><section class="routing"><p class="eyebrow">它后面接的五个 UI SKILL <span>本地角色示意</span></p><div id="roles" aria-label="五种设计职责"></div><div class="role-detail"><p id="role-name"></p><p id="role-description"></p><span id="role-position"></span></div></section><section class="brief"><h2>在决定怎么画之前，先说清楚。</h2><form id="brief-form"><div class="fields"><label>用户<input id="audience" name="audience" maxlength="140" required placeholder="谁会使用？他们熟悉什么？"></label><label>设备<select id="device" name="device"><option value="desktop">桌面网页</option><option value="mobile">手机网页</option><option value="both">桌面与手机</option></select></label><label>场景<select id="context" name="context"><option value="landing">落地页 / 品牌</option><option value="dashboard">后台 / 信息看板</option><option value="reader">文章 / 阅读</option><option value="tool">表单 / 工具</option></select></label><label>目标<textarea id="goal" name="goal" maxlength="400" rows="3" required placeholder="用户来这里要完成什么？"></textarea></label><label>优先级<select id="priority" name="priority"><option value="clarity">清楚易读</option><option value="expression">视觉表达</option><option value="efficiency">操作效率</option></select></label></div><output id="form-result" role="status">填写的信息只留在本页；选型规则由本示例编写。</output><div class="actions"><button type="submit" id="run">整理本地设计简报 →</button><button type="button" id="pause" disabled>暂停</button><button type="button" id="cancel" disabled>取消整理</button></div></form></section><section id="result" hidden><div class="result-heading"><h2>从前提，到能执行的选择。</h2><span id="run-status" role="status"></span></div><div id="checks"></div><ol id="decisions"></ol><div class="actions"><button id="download" disabled>下载设计简报 JSON ↓</button></div><p class="boundary">这是根据输入整理的本地简报和自编规则；没有调用作者 Skill、WorkBuddy 或模型，也不能据此证明页面质量提升。</p></section><section class="principles"><p><i></i> 先问用户、设备、场景、目标和优先级。</p><p><i></i> 方向、审美、页面、规则、实现，各有职责。</p><p><i></i> 结果仍需回到真实页面里验证。</p></section><footer><span>SELF-CODED STUDY / 原作者工具链未运行</span><button id="reset">复位全部</button><label><input type="checkbox" id="reduce"> 减少动态</label><output id="state" aria-live="polite"></output></footer></main><script src="controls.js"></script><script src="ui-precheck.js"></script></body></html>
