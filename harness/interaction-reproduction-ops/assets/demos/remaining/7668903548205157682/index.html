<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI 工具路由与网页示例 · 可操作复现</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#eeeade;color:#4c503d;font:12px system-ui,sans-serif}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:16px;padding:16px 22px;flex-wrap:wrap;border-bottom:1px solid #a9a88855}header b{font-size:13px}select,button{font:inherit;color:inherit;border:1px solid #a9aa8d;border-radius:4px;background:#faf9ef;padding:9px 12px}select{max-width:100%}button{cursor:pointer}label{display:flex;gap:5px;align-items:center;white-space:nowrap}a{color:#606c45;text-decoration:none;border-bottom:1px solid #7f8b6270}output{font-size:10px;color:#87906e}iframe{flex:1;width:100%;border:0;min-height:400px;background:#efede4}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #738e5d;outline-offset:3px}@media(max-width:600px){header{padding:15px 17px;gap:12px}header b{width:100%}select{width:100%}output{width:100%;line-height:1.7}}</style></head><body><header><b>UI 路由 · 页面与交互</b><select id="pick" aria-label="选择示例"><option value="verdant-room.html">Verdant Room · 深绿衬线与植物商店</option><option value="haven.html">Haven · 房间控制与同侧栏移动</option><option value="design-intelligence.html">Design Intelligence · 工具首页与保留文档的演示</option><option value="camille-journal.html">Camille · 衬线文章与阅读位置返回</option><option value="noa-studio.html">Noa · 蓝色强调排字与家具作品</option><option value="mouseshi.html">Mouseshi · 三层照片空间收为竖列</option><option value="ledger.html">Ledger · 绿侧栏与独立经营快照</option><option value="ui-router.html">UI 路由 · 五字段、四操作与真页面交接</option><option value="map-dark.html">Map the dark · 三维粒子星系与笔记</option><option value="../7678941669266619354/coffee.html">慢焙 · 奶油咖啡同款</option><option value="../7678202403443499402/buildly-console.html">Buildly · 暗色控制台同款</option><option value="../7670420512304123136/tasklyn.html">Tasklyn · 淡紫任务台同款</option><option value="../7670420512304123136/aera.html">AERA · 护肤摄影同款</option><option value="../7670420512304123136/noctis.html">Noctis · 星空摄影同款</option><option value="../7678202403443499402/health-header.html">Marlowe · 健康看板同款</option><option value="../7676044704957386024/sound.html">SOUND · 三色排字同款</option><option value="../7672243352040918310/aperture.html">APERTURE · 海岸摄影同款</option><option value="../7673466188667893834/strobe.html">STROBE · 演出首屏同款</option><option value="../7680870950040426867/tuscany-whitespace.html">Tuscany · 留白天气同款</option><option value="../7672243352040918310/shanghai-weather.html">上海徐汇 · 绿卡天气同款</option><option value="../7674865635729378602/card-rhythm.html">默 · 续读卡片同款</option><option value="../7678941669266619354/pets.html?view=walk">暗绿宠物 · 散步快照适配</option><option value="../7680870950040426867/tuanzi-overlap.html">团子 · 深色照护同款</option><option value="../7680870950040426867/tuanzi-overlap.html?pet=milkshake">奶昔 · 紫色照护快照适配</option></select><button id="reset">复位当前页</button><label><input id="reduce" type="checkbox"> 减少动态</label><a id="open" href="verdant-room.html" target="_blank" rel="noopener">独立打开 ↗</a><output id="state" role="status">自制可操作页面；技术验证范围与原片差异分别记录。</output></header><iframe id="demo" src="verdant-room.html" title="当前可操作示例"></iframe><script>
(()=>{const pick=document.querySelector('#pick'),frame=document.querySelector('#demo'),input=document.querySelector('#reduce'),mq=matchMedia('(prefers-reduced-motion:reduce)');let external=false;const reduced=()=>input.checked||external||mq.matches,post=data=>frame.contentWindow.postMessage(data,location.protocol==='file:'?'*':location.origin),prefs=()=>post({type:'motion-prefs',reduced:reduced()});pick.addEventListener('change',()=>{const next=pick.value;document.querySelector('#open').href=next;frame.src=next;document.body.dataset.ready='false'});frame.addEventListener('load',()=>{prefs();document.body.dataset.ready='true'});input.addEventListener('change',prefs);mq.addEventListener('change',prefs);document.querySelector('#reset').addEventListener('click',()=>post({type:'reset'}));addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='demo-state'){document.querySelector('#state').textContent=String(e.data.state).slice(0,300);return}if(e.source!==parent||(location.protocol!=='file:'&&e.origin!==location.origin))return;if(['motion-prefs','motion-preference'].includes(e.data?.type)){external=!!e.data.reduced;prefs()}if(['reset','reset-demo'].includes(e.data?.type))post({type:'reset'})});window.room={reduced};})();
</script></body></html>
