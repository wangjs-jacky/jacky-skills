<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One action, one response · 动态图标</title><link rel="stylesheet" href="feedback.css"><script defer src="feedback.js"></script></head><body><main class="board"><header><span>02 / 02 · MOTION ICON</span><h1>One action.<br>One response.</h1><p>A little motion that tells you what happened.</p></header><section class="showcase" aria-label="Animated feedback"><span class="bracket" aria-hidden="true">(</span><svg id="feedback-icon" viewBox="0 0 100 100" aria-hidden="true"><g id="paper-plane" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 40 84 15 60 84 44 56Z"/><path d="M44 56 84 15" stroke="var(--accent)"/></g><g id="feedback-ring"><circle cx="50" cy="50" r="35" fill="none" stroke="var(--accent)" stroke-width="5" pathLength="100"/></g><path id="feedback-check" d="M34 51 45 63 67 39" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" pathLength="100"/></svg><span class="bracket" aria-hidden="true">)</span></section><nav class="actions" aria-label="Feedback actions"><button id="feedback-send"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m3 9 18-6-6 18-5-8ZM10 13 21 3"/></svg></span><b>Send</b><small>ONE SHOT</small></button><button id="feedback-load" aria-pressed="false"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8" opacity=".2"/><path d="M12 4a8 8 0 0 1 8 8"/></svg></span><b>Loading</b><small>START / STOP</small></button><button id="feedback-clear"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="m7 4-4 9v7h18v-7l-4-9M3 13h5l2 3h4l2-3h5M12 3v7m-3-3 3 3 3-3"/></svg></span><b>Clear</b><small>RESET</small></button></nav><div class="loading-controls"><button id="feedback-finish" disabled>Finish loading</button><button id="feedback-cancel" disabled>Cancel</button></div><fieldset class="colors"><legend>Accent</legend><button type="button" data-color="#ff6034" style="--swatch:#ff6034" aria-label="Orange" aria-pressed="true"></button><button type="button" data-color="#4254ff" style="--swatch:#4254ff" aria-label="Blue" aria-pressed="false"></button><button type="button" data-color="#209358" style="--swatch:#209358" aria-label="Green" aria-pressed="false"></button><button type="button" data-color="#9660eb" style="--swatch:#9660eb" aria-label="Purple" aria-pressed="false"></button></fieldset><output id="feedback-status" role="status">Ready to send</output><footer><button id="reset">重新开始</button><label><input id="reduce" type="checkbox">减少动态</label><p>本地状态演示；加载开始、结束和取消由你操作，无网络请求。</p></footer></main></body></html>
