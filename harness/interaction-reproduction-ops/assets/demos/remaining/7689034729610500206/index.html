<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动态图标与真实状态 · 自制复现</title><style>body{margin:0;background:#e8edf2;font:14px -apple-system,BlinkMacSystemFont,sans-serif}header{display:flex;align-items:center;gap:16px;padding:16px 24px;background:white;flex-wrap:wrap}h1{font-size:18px;margin:0}select,button,a{font:inherit;padding:8px;border-radius:8px;border:1px solid #ddd;background:white;color:#333}iframe{width:100%;height:calc(100vh - 82px);min-height:720px;border:0}@media(max-width:720px){header{padding:12px;gap:8px}h1{font-size:14px}iframe{min-height:750px}}</style><header><h1>动态图标与真实状态 · 自制复现</h1><select aria-label="选择效果" id="case"><option value="1">01 菜单原线变形与真实侧栏</option><option value="2">02 播放三角连续变为暂停双条</option><option value="3">03 太阳轮廓变月形并切换整页主题</option><option value="4">04 空心圈收缩成勾与任务完成度联动</option><option value="5">05 加号变为关闭与本地新增任务</option><option value="6">06 纸飞机曲线飞出与完成文案</option><option value="7">07 加载弧圈与圈后描勾反馈</option><option value="8">08 清空列表退出与音符收件盒空状态</option></select><button id="reset">复位</button><label><input type="checkbox" id="reduce">减少动态</label><a id="standalone" href="app.html#menu">独立打开</a></header><iframe title="可操作交互" id="demo" src="app.html#menu"></iframe><script>const entries=["app.html#menu","app.html#play","app.html#theme","app.html#check","app.html#add","app.html#send","feedback.html","app.html#empty"],frame=document.querySelector('#demo'),choose=document.querySelector('#case');function select(){const n=String(choose.value).padStart(2,'0');frame.src=entries[Number(choose.value)-1];document.querySelector('#standalone').href=frame.src;history.replaceState(null,'','#'+n)}choose.onchange=select;document.querySelector('#reset').onclick=()=>frame.contentWindow.postMessage({type:'reset'},'*');const prefs=()=>frame.contentWindow.postMessage({type:'motion-preference',reduced:document.querySelector('#reduce').checked},'*');document.querySelector('#reduce').onchange=prefs;frame.onload=prefs;if(location.hash){choose.value=+location.hash.slice(1);if(choose.value)select()}</script></html>
