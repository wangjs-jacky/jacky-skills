<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>八种卡片交互 · 自编复现</title><style>body{margin:0;background:#121920;color:#dce6ed;font:13px/1.7 system-ui}header{padding:20px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}h1{font-size:17px;margin:0}a{color:inherit}select,button{font:inherit;color:inherit;background:#23333e;border:1px solid #3d535f;border-radius:7px;padding:8px}iframe{width:100%;height:980px;border:0;display:block}small{color:#8c9eaa}</style><header><h1>八种卡片交互，自编复现</h1><select id="pick" aria-label="选择案例"><option value="origin-pop.html">1 · 从实际入口生长并原路返回的面板</option><option value="commit-button.html">2 · 同一按钮宽条收圆加载再变结果条</option><option value="velocity-carousel.html">3 · 距离和释放速度共同决定翻卡张数</option><option value="continuous-layout.html">4 · 同六张卡的连续列表网格布局</option><option value="three-part-filter.html">5 · 退出补位进入不重叠的三段筛选</option><option value="layered-coupon.html">6 · 券卡三层视差及独立高光投影</option><option value="hold-peek.html">7 · 400毫秒长按同手势的三种结局</option><option value="page-selection.html">8 · 长按驱动整页多选与延后操作条</option></select><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label><a id="open" href="origin-pop.html" target="_blank">独立打开 ↗</a><small>参数为拟合，操作验证与视觉评价分开。</small></header><iframe id="demo" title="可操作自编示例" src="origin-pop.html"></iframe><script>const f=document.querySelector('#demo'),p=document.querySelector('#pick'),reduce=document.querySelector('#reduce');p.onchange=()=>{f.src=p.value;document.querySelector('#open').href=p.value};document.querySelector('#reset').onclick=()=>f.contentWindow.postMessage({type:'reset'},'*');reduce.onchange=()=>f.contentWindow.postMessage({type:'motion-prefs',reduced:reduce.checked},'*');f.onload=()=>reduce.onchange();</script></html>
