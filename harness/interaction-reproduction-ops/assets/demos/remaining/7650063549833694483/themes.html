<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'"><title>主题与模板 · 可见封面浏览</title><link rel="stylesheet" href="themes.css"><script defer src="../7670420512304123136/controls.js"></script><script defer src="themes.js"></script></head><body><main><header><small>HTML PRESENTATION / COVER STUDIES</small><h1>先看结构，再选表达。</h1><p>8种配色封面与6种模板封面。选择、放大，并保留自己的标题与笔记。</p></header><nav aria-label="选择封面组"><button data-view="themes" aria-current="true">配色封面 · 8</button><button data-view="templates">模板封面 · 6</button></nav><section id="theme-grid" aria-label="可见配色封面"></section><section id="template-grid" aria-label="可见模板封面" hidden></section><section class="actions"><button id="reset">复位全部封面</button><label><input id="reduce" type="checkbox">减少动态</label></section><p id="state" role="status" aria-live="polite">选择封面可放大同一个HTML节点；未展示的内页不在本例中。</p><details><summary>来源与范围</summary><p>原片可见两组封面：两行四列配色与六种模板。这里只复现可见封面，不把“36套”标签补成36份已取得的模板。公开文案独立改写，选择、编辑、笔记、放大、取消、返回与键盘规则为本地补写；没有运行作者Skill或生成链。</p></details></main><dialog id="reader"><header><h2 id="reader-label">当前封面</h2><button id="close-reader">返回封面 ×</button></header><div id="reader-stage"><div id="reader-slot"></div></div><form id="cover-form"><label>当前封面的标题<textarea id="cover-title" required maxlength="60" rows="2"></textarea></label><label>当前封面的笔记<input id="cover-note" maxlength="120" placeholder="只保留在当前文档"></label><footer><button type="button" id="cancel-cover">取消修改</button><button type="submit" id="save-cover">保存封面内容</button></footer></form><p id="cover-state" role="status"></p></dialog></body></html>
