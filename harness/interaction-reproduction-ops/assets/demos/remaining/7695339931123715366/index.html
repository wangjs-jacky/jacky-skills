<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六个精致交互 · 自制复现</title><style>body{margin:0;background:#e8edf2;font:14px -apple-system,BlinkMacSystemFont,sans-serif}header{display:flex;align-items:center;gap:16px;padding:16px 24px;background:white;flex-wrap:wrap}h1{font-size:18px;margin:0}select,button,a{font:inherit;padding:8px;border-radius:8px;border:1px solid #ddd;background:white;color:#333}iframe{width:100%;height:calc(100vh - 82px);min-height:720px;border:0}@media(max-width:720px){header{padding:12px;gap:8px}h1{font-size:14px}iframe{min-height:750px}}</style><header><h1>六个精致交互 · 自制复现</h1><select aria-label="选择效果" id="case"><option value="1">01 完成反馈按钮</option><option value="2">02 勾选联动</option><option value="3">03 叠卡展开</option><option value="4">04 吸附卡加画线</option><option value="5">05 惯性滚轮</option><option value="6">06 圆形扩散转场</option></select><button id="reset">复位</button><label><input type="checkbox" id="reduce">减少动态</label><a id="standalone" href="cases/01.html">独立打开</a></header><iframe title="可操作交互" id="demo" src="cases/01.html"></iframe><script>const frame=document.querySelector('#demo'),choose=document.querySelector('#case');function select(){const n=String(choose.value).padStart(2,'0');frame.src='cases/'+n+'.html';document.querySelector('#standalone').href=frame.src;history.replaceState(null,'','#'+n)}choose.onchange=select;document.querySelector('#reset').onclick=()=>frame.contentWindow.postMessage({type:'reset'},'*');const prefs=()=>frame.contentWindow.postMessage({type:'motion-preference',reduced:document.querySelector('#reduce').checked},'*');document.querySelector('#reduce').onchange=prefs;frame.onload=prefs;if(location.hash){choose.value=+location.hash.slice(1);if(choose.value)select()}</script></html>
