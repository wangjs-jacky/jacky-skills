<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>惯性滚轮 · Remind</title><link rel="stylesheet" href="../app.css"><link rel="stylesheet" href="05.css"><body><div class="viewport"><main class="phone"><div class="status"><span>9:41</span><i class="battery" aria-hidden="true"></i></div><div class="app-body"><header class="app-heading"><h1>Remind</h1><small>SET A TIME</small></header><p class="task-label">WRITE 300 WORDS</p><output id="selected-time" aria-live="off">09:30</output><div class="picker"><div class="selection" aria-hidden="true"></div><div id="hours" class="wheel" role="spinbutton" aria-label="小时，上下拖动或使用方向键" aria-valuemin="0" aria-valuemax="23" aria-valuenow="9" tabindex="0"></div><span class="colon" aria-hidden="true">:</span><div id="minutes" class="wheel" role="spinbutton" aria-label="分钟，5分钟一档" aria-valuemin="0" aria-valuemax="55" aria-valuenow="30" tabindex="0"></div></div><button id="remind">Remind me</button><p id="confirmation" aria-live="polite"></p></div><nav class="bottom-nav" aria-label="原片底栏构图示意"></nav><div class="home-indicator" aria-hidden="true"></div></main></div><footer class="tools"><button id="reset">复位</button><button id="zoom">原尺寸</button><label><input id="reduce" type="checkbox">减少动态</label><output id="state" aria-live="polite">09:30</output></footer><script type="module" src="05.js"></script></body></html>
