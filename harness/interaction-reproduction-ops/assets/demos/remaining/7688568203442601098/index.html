<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>十个交互组件 · 自制复现</title><style>body{margin:0;background:#e8edf2;font:14px -apple-system,BlinkMacSystemFont,sans-serif}header{display:flex;align-items:center;gap:16px;padding:16px 24px;background:white;flex-wrap:wrap}h1{font-size:18px;margin:0}select,button,a{font:inherit;padding:8px;border-radius:8px;border:1px solid #ddd;background:white;color:#333}iframe{width:100%;height:calc(100vh - 82px);min-height:720px;border:0}@media(max-width:720px){header{padding:12px;gap:8px}h1{font-size:14px}iframe{min-height:750px}}</style><header><h1>十个交互组件 · 自制复现</h1><select aria-label="选择效果" id="case"><option value="1">01 圆形按钮原位展开为搜索框</option><option value="2">02 悬浮加号原容器展开为面板</option><option value="3">03 同按钮收圆、环进度、描勾与结果条</option><option value="4">04 同SVG路径的菜单与播放状态变形</option><option value="5">05 前后沿分时拉伸的液态标签线</option><option value="6">06 加号弹开数量步进器与竖向数字柱</option><option value="7">07 列表真实增高与三层详情就地展开</option><option value="8">08 同六图的弧线交错FLIP布局切换</option><option value="9">09 原生滚动连续驱动搜索顶栏收起</option><option value="10">10 按钮中心扩圆与覆盖后菜单交错入场</option></select><button id="reset">复位</button><label><input type="checkbox" id="reduce">减少动态</label><a id="standalone" href="cases/01.html">独立打开</a></header><iframe title="可操作交互" id="demo" src="cases/01.html"></iframe><script>const entries=["cases/01.html","cases/02.html","cases/03.html","cases/04.html","cases/05.html","cases/06.html","cases/07.html","cases/08.html","cases/09.html","cases/10.html"],frame=document.querySelector('#demo'),choose=document.querySelector('#case');function select(){const n=String(choose.value).padStart(2,'0');frame.src=entries[Number(choose.value)-1];document.querySelector('#standalone').href=frame.src;history.replaceState(null,'','#'+n)}choose.onchange=select;document.querySelector('#reset').onclick=()=>frame.contentWindow.postMessage({type:'reset'},'*');const prefs=()=>frame.contentWindow.postMessage({type:'motion-preference',reduced:document.querySelector('#reduce').checked},'*');document.querySelector('#reduce').onchange=prefs;frame.onload=prefs;if(location.hash){choose.value=+location.hash.slice(1);if(choose.value)select()}</script></html>
