<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web演进 · 可操作方法集</title><style>body{margin:0;background:#f4f1e9;color:#4e4a3f;font:13px/1.7 system-ui}header{padding:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:17px;margin:0}button,select{font:inherit;padding:7px 12px;border:1px solid #d7d0c1;background:#fffdf6;border-radius:18px;max-width:100%}a{color:inherit}small{color:#a19681}iframe{width:100%;height:1200px;border:0;display:block}</style><header><h1>Web演进 · 六新方法与一同款。</h1><select id="pick" aria-label="选择示例"><option value="greenhouse-existing.html">种植高密度看板 · 既有唯一代码</option><option value="tech-stories.html">同节点迁移与可往返的技术分步图示</option><option value="style-wipe.html" selected>真实DOM样式擦拭与滞后职责标签</option><option value="js-counter.html">可打断演示的真实Click计数器</option><option value="js-validation.html">文本输入的即时错误与通过反馈</option><option value="js-menu.html">保留三行身份的汉堡导航展开与收回</option><option value="ajax-context.html">整区重建与保留上下文的局部更新对照</option></select><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label><a id="open" href="style-wipe.html" target="_blank">独立打开 ↗</a><small>六新方法、一同款沿原代码；十一教学章合并为一方法，视觉待评价。</small></header><iframe id="demo" src="style-wipe.html" title="真实HTML交互"></iframe><script>const f=document.querySelector("#demo"),p=document.querySelector("#pick"),r=document.querySelector("#reduce");p.onchange=()=>{f.src=p.value;document.querySelector("#open").href=p.value};document.querySelector("#reset").onclick=()=>f.contentWindow.postMessage({type:"reset"},"*");r.onchange=()=>f.contentWindow.postMessage({type:"motion-prefs",reduced:r.checked},"*");f.onload=()=>r.onchange();</script></html>
