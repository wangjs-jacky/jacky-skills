<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JavaScript · 输入与即时校验</title><link rel="stylesheet" href="lesson.css"><link rel="stylesheet" href="browser-stage.css"><link rel="stylesheet" href="js-validation.css"><script defer src="controls.js"></script><script defer src="js-validation.js"></script></head><body>
<main class="paper"><span class="year-mark" aria-hidden="true">1995</span><header class="chapter-head"><b>05</b><h1>1995 · JavaScript</h1></header><div class="behavior-layout"><section class="browser" aria-label="可以实际输入的表单"><div class="browser-bar" aria-hidden="true"><i></i><i></i><i></i></div><div class="browser-content"><form id="validation-form" novalidate><label for="name" class="sr-only">输入至少4个字符</label><input id="name" type="text" placeholder="输入至少 4 个字符" autocomplete="off" spellcheck="false" maxlength="40" aria-describedby="feedback" aria-invalid="false"><p id="feedback" aria-live="polite"></p></form></div></section><aside class="principles"><h2>网页第一次有了「行为」</h2><span class="principle">点击可以变化</span><span class="principle active">表单可以校验</span><span class="principle" hidden>内容随操作改变</span></aside></div><div class="timeline" style="--line:25%" aria-label="原片讲解时间轴"><span class="past">1989</span><span class="past">1990</span><span class="active">1995</span><span>2005</span><span>2006</span><span>2009</span><span>2012</span><span>’13–’14</span><span>AI</span></div></main>
<div class="demo-controls"><button id="short-example">短例 xig</button><button id="valid-example">通过例 xigua2026</button><button id="confirm" type="submit" form="validation-form" class="primary">验证当前输入</button><button id="reset">清空输入</button><label><input type="checkbox" id="reduce">减少动态</label><output id="state" aria-live="polite"></output></div><p class="demo-note">输入可在错误与通过之间实时往返。这里验证本地字符长度，不是账号可用性或服务端验证；示例按钮、提交和空白处理为补写。</p></body></html>
