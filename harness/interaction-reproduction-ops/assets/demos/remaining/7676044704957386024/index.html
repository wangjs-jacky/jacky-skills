<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五种网页表达 · 可操作方法集</title><style>body{margin:0;background:#efeee8;color:#404a3d;font:13px/1.7 system-ui}header{padding:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:17px;margin:0}button,select{font:inherit;padding:7px 12px;border:1px solid #cfd3c7;background:#fafbf7;border-radius:18px;max-width:100%}a{color:inherit}small{color:#82907b}iframe{width:100%;height:1200px;border:0;display:block}</style><header><h1>五种网页表达。</h1><select id="pick" aria-label="选择示例"><option value="salon.html">SALON · 大留白编辑分栏与五图拼贴</option><option value="forma.html">FORMA · 双照片局部显影与光圈跟随</option><option value="marchal.html">MARCHAL · 七人物竖栏聚焦与颜色交接</option><option value="sound.html">SOUND · 近黑底三色标题与空心层级</option><option value="stratum.html">STRATUM · 速度驱动的五图纵深长廊</option></select><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label><a id="open" href="salon.html" target="_blank">独立打开 ↗</a><small>真实自编交互；原片教学与补写分别记录，视觉待评价。</small></header><iframe id="demo" src="salon.html" title="真实HTML交互"></iframe><script>const f=document.querySelector("#demo"),p=document.querySelector("#pick"),r=document.querySelector("#reduce");p.onchange=()=>{f.src=p.value;document.querySelector("#open").href=p.value};document.querySelector("#reset").onclick=()=>f.contentWindow.postMessage({type:"reset"},"*");r.onchange=()=>f.contentWindow.postMessage({type:"motion-prefs",reduced:r.checked},"*");f.onload=()=>r.onchange();</script></html>
