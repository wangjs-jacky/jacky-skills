<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A place to begin · 紫色默认页演练</title><script defer src="../7670420512304123136/controls.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#6030e6;color:white;font:16px/1.5 system-ui}.cover{height:100svh;min-height:650px;display:grid;place-content:center;text-align:center;padding:30px;background:linear-gradient(120deg,#7933ef,#4429cf)}.brand{position:absolute;top:35px;left:40px;font-size:14px}h1{font-size:clamp(30px,4vw,54px);margin:0}p{font-size:18px;opacity:.7}button,input,textarea{font:inherit}button{cursor:pointer;padding:13px 22px;border:0;border-radius:9px;background:#fff;color:#5932cf}#begin{justify-self:center;margin-top:15px}.lab{padding:25px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}.lab button{font-size:13px}.lab output{width:100%;font-size:12px}dialog{width:min(580px,90vw);background:#f8f5ff;border:1px solid #c4b7ef;border-radius:20px;color:#33264d;padding:25px}dialog::backdrop{background:#19083199;backdrop-filter:blur(6px)}textarea{display:block;width:100%;min-height:160px;margin:15px 0;padding:12px}dialog button{border:1px solid #c9b6ed}button:focus-visible,textarea:focus-visible{outline:3px solid #ffd86a;outline-offset:4px}.reduced *{transition:none!important;animation:none!important}</style><body><main class="cover"><span class="brand">YOUR APP</span><h1>A place for your next idea.</h1><p>Start with one clear purpose. Give it room to grow.</p><button id="begin">Get started →</button></main><footer class="lab"><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label><output id="state">默认页补写：实际文本与本地笔记，不调用作者模型。</output></footer><dialog id="draft"><h2>Keep the first idea.</h2><form id="note-form"><label>本地笔记<textarea id="note" required maxlength="400"></textarea></label><button id="cancel" type="button">取消</button><button id="save">保留笔记</button></form></dialog><script>let saved='';const pick=s=>document.querySelector(s);pick('#begin').onclick=()=>{pick('#note').value=saved;pick('#draft').showModal()};pick('#cancel').onclick=()=>pick('#draft').close();pick('#note-form').onsubmit=e=>{e.preventDefault();saved=pick('#note').value;pick('#draft').close();room.announce('已保留本页想法。')};pick('#draft').addEventListener('close',()=>pick('#begin').focus({preventScroll:true}));function resetPurple(){if(pick('#draft').open)pick('#draft').close();saved='';pick('#note').value=''}addEventListener('DOMContentLoaded',()=>{addEventListener('room-reset',resetPurple);window.purpleLab={reset:resetPurple,state:()=>({saved,open:pick('#draft').open,reduced:room.reduced()})};document.body.dataset.ready='true'});</script></body></html>
