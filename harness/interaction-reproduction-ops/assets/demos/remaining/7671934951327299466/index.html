<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识库演练 · 四组真实自制代码</title><style>body{margin:0;background:#eef1e9;color:#2f5145;font:13px/1.7 system-ui}header{padding:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:17px;margin:0}button,select{font:inherit;padding:7px 12px;border:1px solid #bdcfc3;background:#f9fff9;border-radius:18px;max-width:100%}a{color:inherit}small{color:#8b9f93}iframe{width:100%;height:1200px;border:0;display:block}</style><header><h1>知识库演练 · 可操作自制代码</h1><select id="pick" aria-label="选择示例"><option value="knowledge-network.html">四类倾斜笔记与可追溯的知识网络</option><option value="memory-architecture.html">散落输入到三层结构 · 双职责与归类教学</option><option value="memory-workbench.html">本地知识库演练台 · 来源、规则与四种可复查用途</option><option value="lumina.html">光与影之间 · 橙车摄影页与上下结构对照</option></select><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label><a id="open" href="knowledge-network.html" target="_blank">独立打开 ↗</a><small>四个演练单元；教学/本地计算与作者工具链及用户审美分开。</small></header><iframe id="demo" src="knowledge-network.html" title="自制HTML效果"></iframe><script>const f=document.querySelector("#demo"),p=document.querySelector("#pick"),r=document.querySelector("#reduce");p.onchange=()=>{f.src=p.value;document.querySelector("#open").href=p.value};document.querySelector("#reset").onclick=()=>f.contentWindow.postMessage({type:"reset"},"*");r.onchange=()=>f.contentWindow.postMessage({type:"motion-prefs",reduced:r.checked},"*");f.onload=()=>r.onchange();</script></html>
