<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六种Dashboard侧栏 · 自制复现</title><style>body{margin:0;background:#e8edf2;font:14px -apple-system,BlinkMacSystemFont,sans-serif}header{display:flex;align-items:center;gap:16px;padding:16px 24px;background:white;flex-wrap:wrap}h1{font-size:18px;margin:0}select,button,a{font:inherit;padding:8px;border-radius:8px;border:1px solid #ddd;background:white;color:#333}iframe{width:100%;height:calc(100vh - 82px);min-height:720px;border:0}@media(max-width:720px){header{padding:12px;gap:8px}h1{font-size:14px}iframe{min-height:750px}}</style><header><h1>六种Dashboard侧栏 · 自制复现</h1><select aria-label="选择效果" id="case"><option value="1">01 16像素留白与柔影浮动侧栏</option><option value="2">02 低对比常规项与橙色当前项的深色侧栏</option><option value="3">03 12%白色与24像素背景模糊的玻璃侧栏</option><option value="4">04 72像素模块轨与240像素二级面板联动</option><option value="5">05 72到240像素悬停展开与文字延后进入</option><option value="6">06 分组留白、独立滚动与固定用户底部</option></select><button id="reset">复位</button><label><input type="checkbox" id="reduce">减少动态</label><a id="standalone" href="float.html">独立打开</a></header><iframe title="可操作交互" id="demo" src="float.html"></iframe><script>const entries=["float.html","dark.html","glass.html","dual.html","hover.html","grouped.html"],frame=document.querySelector('#demo'),choose=document.querySelector('#case');function select(){const n=String(choose.value).padStart(2,'0');frame.src=entries[Number(choose.value)-1];document.querySelector('#standalone').href=frame.src;history.replaceState(null,'','#'+n)}choose.onchange=select;document.querySelector('#reset').onclick=()=>frame.contentWindow.postMessage({type:'reset'},'*');const prefs=()=>frame.contentWindow.postMessage({type:'motion-preference',reduced:document.querySelector('#reduce').checked},'*');document.querySelector('#reduce').onchange=prefs;frame.onload=prefs;if(location.hash){choose.value=+location.hash.slice(1);if(choose.value)select()}</script></html>
