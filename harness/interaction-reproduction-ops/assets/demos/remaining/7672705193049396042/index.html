<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设计语言 · 三新方法与两同款</title><style>body{margin:0;background:#eef1e9;color:#2f5145;font:13px/1.7 system-ui}header{padding:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:17px;margin:0}button,select{font:inherit;padding:7px 12px;border:1px solid #bdcfc3;background:#f9fff9;border-radius:18px;max-width:100%}a{color:inherit}small{color:#8b9f93}iframe{width:100%;height:1200px;border:0;display:block}</style><header><h1>设计语言 · 可操作自制代码</h1><select id="pick" aria-label="选择示例"><option value="luke.html">Luke · 混排个人站、轻漂浮图库与错峰白行</option><option value="design-language.html">五层观察、可编辑说明书与产品结构迁移</option><option value="kinetic-brand.html">KINETIC · 三色巨字与独立散词漂浮</option><option value="marchal-existing.html">MARCHAL · 七人物竖栏既有唯一代码</option><option value="buildly-existing.html">Buildly · 既有双曲线与三滑杆数据台</option></select><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label><a id="open" href="luke.html" target="_blank">独立打开 ↗</a><small>三新方法、两同款原代码；教学/拟合/实际作者执行与审美认可分开。</small></header><iframe id="demo" src="luke.html" title="自制HTML效果"></iframe><script>const f=document.querySelector("#demo"),p=document.querySelector("#pick"),r=document.querySelector("#reduce");p.onchange=()=>{f.src=p.value;document.querySelector("#open").href=p.value};document.querySelector("#reset").onclick=()=>f.contentWindow.postMessage({type:"reset"},"*");r.onchange=()=>f.contentWindow.postMessage({type:"motion-prefs",reduced:r.checked},"*");f.onload=()=>r.onchange();</script></html>
