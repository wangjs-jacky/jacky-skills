<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRAZE · 扫描台</title><link rel="stylesheet" href="graze.css"><script defer src="controls.js"></script><script defer src="graze.js"></script></head><body>
<header class="study-head"><b>GRAZE</b><span>扫描台</span></header><main class="study-layout"><div class="phone-wrap"><section class="phone" aria-label="GRAZE食物扫描台"><div class="status-bar"><b>10:26</b><i aria-hidden="true"></i><span aria-hidden="true">▴▴▴ ▰</span></div><div class="app-surface"><header class="app-header"><button id="menu" aria-label="打开记录菜单">☰</button><div><button id="reminder" aria-label="查看用餐安排">♧</button><button id="profile" class="avatar" aria-label="我的食物记录"><span aria-hidden="true">G</span></button></div></header><div class="app-scroll" id="graze-scroll"><h1>看看这一口<br><span>里面有什么</span></h1><div class="search-row"><label class="search-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="search" type="search" placeholder="输入食物或食材名称…" aria-label="搜索食物记录" autocomplete="off"></label><button id="filter" aria-label="筛选食物记录" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></svg></button></div><div class="section-heading"><h2 id="list-heading">最近扫过</h2><button id="all-records">全部</button></div><div class="food-strip" id="food-strip" role="group" aria-label="最近食物记录"></div><p id="empty" hidden>没有找到这份食物。换个词试试，或手动添加一条。</p><section id="detail" class="detail-card" aria-label="当前食物详情"><div class="detail-heading"><button id="detail-photo" aria-label="查看当前食物照片"><img id="detail-img" alt=""></button><button id="detail-title" aria-label="编辑当前食物记录"><b id="selected-name"></b><small id="selected-protein"></small></button><div class="score"><strong id="score"></strong><small>SCORE</small></div></div><div class="score-track"><i id="score-bar"></i><span id="score-dot"></span></div><div class="score-labels" aria-hidden="true"><span>低</span><span>一般</span><span>好</span></div><div id="detail-macros" class="detail-macros"></div><div class="detail-actions"><button id="save-food" aria-pressed="false">☆ 收藏这份搭配</button><button id="edit-food">编辑数值 ↗</button></div></section></div><nav class="bottom-nav" aria-label="扫描台主要功能"><button data-nav="home" aria-label="全部记录" aria-pressed="true">♧</button><button data-nav="history" aria-label="查看历史">▣</button><button data-nav="scan" class="scan-button" aria-label="选择照片并手动记录"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5M3 12h18"/></svg></button><button data-nav="saved" aria-label="已收藏记录">◇</button><button data-nav="profile" aria-label="我的记录汇总">♙</button></nav></div><dialog id="panel"><header><h2 id="panel-title"></h2><button id="close-panel" aria-label="关闭面板">×</button></header><div id="panel-body"></div></dialog></section></div>
<aside class="editor"><p class="eyebrow">A CLOSER LOOK AT YOUR PLATE</p><h2>看看这一口，<br>也留下自己的记录。</h2><p>横向浏览、搜索与筛选保留同一份食物记录。照片只在本页解码与预览，营养数字由你填写。</p><label>配色</label><div id="palettes" class="palettes"></div><label for="accent-hex">强调色</label><input id="accent-hex" value="#93AD76" maxlength="7" spellcheck="false"><label for="font-scale">整页字号 <output id="font-reading">100%</output></label><input id="font-scale" type="range" min="85" max="125" step="5" value="100"><div class="audit"><span>当前记录 <b id="record-count">3</b></span><span>收藏 <b id="saved-count">0</b></span><span>当前筛选 <b id="filter-label">全部</b></span><button id="restore-records">恢复初始记录</button></div><div class="export-actions"><button id="copy-spec">复制当前规格 ↗</button><button id="download-record">保存记录 JSON ↓</button></div><output id="editor-status" role="status">手动记录保存在本页。</output></aside></main><footer class="study-footer"><p>原片可见的绿色外框、圆图横卡与88评分关系按画面拟合。搜索、筛选、收藏、手动数值与照片导入为本地补写；三个比例是独立样本指标，不是营养数据库或图像识别结果。所有界面为代码，自制照片沿来源记录复用。</p><div><button id="reset">复位全部</button><label><input type="checkbox" id="reduce"> 减少动态</label><output id="state" role="status"></output></div></footer></body></html>
