<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今日仪式 · 护理清单</title><link rel="stylesheet" href="skin-ritual.css"></head><body>
<div class="phone-wrap"><main class="phone"><div class="status-bar"><span>21:33</span><span aria-hidden="true">▮▮▮ ▰</span></div><header class="top"><button id="calendar" aria-label="选择演示日期">▢</button><div><h1>今日仪式</h1><p id="date-title">7月30日 · 周四</p></div><button id="notifications" aria-label="查看本地提醒">♧</button></header>
<div class="scroll-body" id="scroll-body"><section class="ritual-progress" aria-label="日常护理进度"><svg id="progress-arc" viewBox="0 0 330 180" aria-hidden="true"></svg><div class="progress-copy"><p id="short-date">⚡7月30日</p><strong><span id="complete-count">0</span><small>/11步</small></strong><p id="progress-note">一小步，也算认真生活</p><button id="next-step" aria-label="记录下一项未完成仪式">＋</button></div></section>
<nav class="routine-tabs" aria-label="选择护理清单"><button data-routine="morning" aria-pressed="true">早间仪式 <span>6</span></button><button data-routine="evening" aria-pressed="false">晚间仪式 <span>5</span></button><button data-routine="weekly" aria-pressed="false">每周特护 <span>2</span></button></nav>
<button class="skin-note" id="skin-profile"><div class="product mini tube" aria-hidden="true"><i></i></div><div><h2 id="skin-name">油皮专属定制 <small>本地偏好</small></h2><p id="skin-copy">按自己的节奏整理日常步骤。清单是演示样例，不提供肤质诊断或真实产品方案。</p></div><span aria-hidden="true">›</span></button>
<div class="list-heading"><h2 id="routine-title">早间仪式</h2><span id="routine-count">0 / 6</span></div><div class="steps" id="steps"></div><p class="boundary">前两项名称与清单结构来自可见画面；其余名称、笔记和操作为本地补写。无产品推荐、账号或消息发送。</p></div>
<nav class="tabbar" aria-label="底部导航"><button id="home-tab" aria-label="回到仪式首页" aria-current="page">⌂</button><button id="stats-tab" aria-label="查看本地记录统计">◎</button><button id="record-tab" aria-label="记录下一项仪式">≡</button><button id="saved-tab" aria-label="查看收藏的步骤">☆</button><button id="profile-tab" aria-label="查看本地偏好">♙</button></nav>
<dialog id="step-dialog"><button id="close-step" class="close" aria-label="取消步骤编辑">关闭 ×</button><p class="eyebrow" id="step-number"></p><div id="detail-product" class="product tube" aria-hidden="true"><i></i></div><h2 id="step-title"></h2><p id="step-description"></p><form id="step-form"><label class="completion"><input id="step-complete" type="checkbox"> 本次已完成</label><label>本次笔记<textarea id="step-note" maxlength="500" rows="3" placeholder="只保存在这个打开的页面"></textarea></label><div class="sheet-actions"><button id="favorite-step" type="button" aria-pressed="false">☆ 收藏</button><button id="save-step" type="submit">保存这一步 →</button></div></form></dialog>
<dialog id="calendar-dialog"><button id="close-calendar" class="close">返回 ×</button><p class="eyebrow">DEMO WEEK / JULY 2026</p><h2>给每一天，<br>留一个位置。</h2><div id="dates" class="dates"></div><p>只切换本地演示日期，各日的完成情况和笔记独立。</p></dialog>
<dialog id="info-dialog"><button id="close-info" class="close">返回 ×</button><p class="eyebrow">YOUR LOCAL RITUAL</p><h2 id="info-title"></h2><div id="info-body"></div></dialog>
</main></div><footer><span>今日仪式 / 自编演示</span><button id="reset">复位</button><label><input type="checkbox" id="reduce">减少动态</label></footer><p id="state" class="state" role="status" aria-live="polite">11个日常步骤与2个额外特护示例；只保存在当前页面，不提供护理建议。</p><script src="controls.js"></script><script src="skin-ritual.js"></script></body></html>
