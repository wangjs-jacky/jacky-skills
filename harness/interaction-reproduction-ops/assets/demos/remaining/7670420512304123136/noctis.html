<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noctis · 把整片星空装进兜里</title><link rel="stylesheet" href="noctis.css"><body><main class="hero"><img class="sky-photo" src="assets/noctis-sky.png" alt="自制蓝紫银河星空"><div class="veil"></div><header><span class="brand"><i></i>Noctis</span><span class="brand-note">探索宇宙 · STARGAZING</span></header><section class="hero-copy"><p class="eyebrow">— &nbsp; 与星辰相遇 &nbsp; —</p><h1>把整片<span>星空</span>装进兜里</h1><p class="subtitle">NIGHT SKY · IN YOUR POCKET</p><p class="intro">抬头看见辽阔，也看见此刻。<br>从一颗星出发，把属于夜晚的片刻慢慢收好。</p><button id="explore" aria-label="打开离线星图演练"><span class="orb"><svg viewBox="0 0 60 60" aria-hidden="true"><path d="M30 10L34 26L47 30L34 34L30 50L26 34L13 30L26 26Z"/></svg></span><small>开启你的星空</small></button></section></main><footer><span>NOCTIS / 夜空随想</span><button id="reset">复位</button><label><input type="checkbox" id="reduce">减少动态</label></footer><p id="state" class="state" role="status" aria-live="polite">原片星空首屏的自编实现；星图为离线位置示意，不读取定位、实时天空或天文服务。</p>
<dialog id="explorer"><header><div><p class="eyebrow">NOCTIS / OFFLINE SKY STUDY</p><h2>留下一颗星。</h2></div><button id="close-sky" aria-label="返回星空首屏">关闭 ×</button></header><div class="sky-layout"><div class="sky-map" id="sky-map" aria-label="离线示意星图"><div class="north" aria-hidden="true">N</div><svg id="map-svg" viewBox="0 0 500 420" aria-hidden="true"><circle cx="250" cy="210" r="180"/><circle cx="250" cy="210" r="120"/><circle cx="250" cy="210" r="60"/><path d="M70 210H430M250 30V390"/><g id="constellation-lines"></g></svg><div id="stars"></div></div><aside class="sky-details"><p class="eyebrow">ILLUSTRATIVE CONSTELLATION</p><h3 id="star-name">天琴座</h3><p id="star-description"></p><label for="hour">观察时刻 <output id="hour-reading">22:00</output></label><input type="range" id="hour" min="18" max="24" step="1" value="22"><p class="map-note">三组位置按视觉示意，时刻只转动此图。</p><button id="save-star">收藏这组星</button><p id="saved-reading">还没有收藏</p><form id="note-form"><label for="note">给此刻留一句话</label><textarea id="note" rows="3" maxlength="200" required></textarea><div class="note-actions"><button type="button" id="cancel-note">取消改写</button><button type="submit">保存本页</button></div></form><p id="saved-note" aria-live="polite"></p></aside></div></dialog><script src="controls.js"></script><script src="noctis.js"></script></body></html>
