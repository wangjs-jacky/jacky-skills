<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三角色设计与网页示例 · 可操作复现</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#eeeade;color:#4c503d;font:12px system-ui,sans-serif}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:16px;padding:16px 22px;flex-wrap:wrap;border-bottom:1px solid #a9a88855}header b{font-size:13px}select,button{font:inherit;color:inherit;border:1px solid #a9aa8d;border-radius:4px;background:#faf9ef;padding:9px 12px}select{max-width:100%}button{cursor:pointer}label{display:flex;gap:5px;align-items:center;white-space:nowrap}a{color:#606c45;text-decoration:none;border-bottom:1px solid #7f8b6270}output{font-size:10px;color:#87906e}iframe{flex:1;width:100%;border:0;min-height:400px;background:#efede4}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #738e5d;outline-offset:3px}@media(max-width:600px){header{padding:15px 17px;gap:12px}header b{width:100%}select{width:100%}output{width:100%;line-height:1.7}}</style></head><body><header><b>三角色设计 · 页面与交互</b><select id="pick" aria-label="选择示例"><option value="drift-analytics.html">Analytics · 同节点四次改版与风格漂移</option><option value="tasklyn.html">Tasklyn · 淡紫任务台与独立项目状态</option><option value="aera.html">AERA · 奶油护肤首屏与同图详情</option><option value="kai.html">KAI · 森林错位排字与同图作品返回</option><option value="noctis.html">Noctis · 星空首屏与离线星图笔记</option><option value="rules-counterexample.html">两份反例 · 按场景调整运营台与落地页</option><option value="isak.html">Isak · 人像跨界与六图散落作品墙</option><option value="sparkcraft.html">SPARKCRAFT · 四行标题与真实几何品牌首屏</option><option value="creative-cube.html">CREATIVE · 真实3D照片块散开与回拢</option><option value="three-role-workflow.html">三角色 · 可编辑规格与四真页面交接</option><option value="skin-ritual.html">今日仪式 · 分组步骤、日常进度与逐日笔记</option><option value="still-here.html">STILL · 中文轻重排字与原位阅读返回</option><option value="photo-sphere.html">ORBIT · 真实照片球与同节点联系表</option><option value="silence.html">SILENCE · 黄色产品摄影与衬线叠字</option><option value="../7676044704957386024/sound.html">SOUND · 三色排字同款</option><option value="forma-material.html">FORMA · 圆内陈设变体</option><option value="../7678202403443499402/health-header.html">Marlowe · 健康看板同款</option><option value="../7680870950040426867/tuanzi-overlap.html">团子 · 深色照护同款</option><option value="../7680870950040426867/tuscany-whitespace.html">Tuscany · 手机天气同款</option><option value="../7680870950040426867/forage-stagger.html">FORAGE · 双列食谱同款</option><option value="../7672243352040918310/shanghai-weather.html">上海徐汇 · 绿卡天气同款</option><option value="../7671507496757988635/halo.html">HALO · 冥想绿卡同款</option></select><button id="reset">复位当前页</button><label><input id="reduce" type="checkbox"> 减少动态</label><a id="open" href="drift-analytics.html" target="_blank" rel="noopener">独立打开 ↗</a><output id="state" role="status">自制可操作页面；技术验证范围与原片差异分别记录。</output></header><iframe id="demo" src="drift-analytics.html" title="当前可操作示例"></iframe><script>
(()=>{const pick=document.querySelector('#pick'),frame=document.querySelector('#demo'),input=document.querySelector('#reduce'),mq=matchMedia('(prefers-reduced-motion:reduce)');let external=false;const reduced=()=>input.checked||external||mq.matches,post=data=>frame.contentWindow.postMessage(data,location.protocol==='file:'?'*':location.origin),prefs=()=>post({type:'motion-prefs',reduced:reduced()});pick.addEventListener('change',()=>{const next=pick.value;document.querySelector('#open').href=next;frame.src=next;document.body.dataset.ready='false'});frame.addEventListener('load',()=>{prefs();document.body.dataset.ready='true'});input.addEventListener('change',prefs);mq.addEventListener('change',prefs);document.querySelector('#reset').addEventListener('click',()=>post({type:'reset'}));addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='demo-state'){document.querySelector('#state').textContent=String(e.data.state).slice(0,300);return}if(e.source!==parent||(location.protocol!=='file:'&&e.origin!==location.origin))return;if(['motion-prefs','motion-preference'].includes(e.data?.type)){external=!!e.data.reduced;prefs()}if(['reset','reset-demo'].includes(e.data?.type))post({type:'reset'})});window.room={reduced};})();
</script></body></html>
