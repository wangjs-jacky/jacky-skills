<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>红点起源 · 徒步首页的通知展开</title><link rel="stylesheet" href="../task.css"><link rel="stylesheet" href="09.css"><body><main class="shell"><section class="board hike" data-width="375" data-height="812" data-fit-height="true" aria-label="徒步首页"><div class="hike-scroll" id="hike-scroll"><header class="profile-bar"><img class="avatar" src="../assets/hiker-avatar.png" alt="自制替代头像"><div class="profile-copy"><b>沈知遥</b><small>◎ 浙江 · 莫干山一带⌄</small></div><button class="round-action" id="search-open" aria-label="搜索路线"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 1 0 0 12 6 6 0 0 0 0-12m4.5 10.5 5 5"/></svg></button><button class="round-action" id="notifications" aria-label="打开提醒" aria-expanded="false" aria-controls="notice-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10a6 6 0 0 1 12 0v5l2 2H4l2-2zm4 10h4"/></svg><span class="notice-dot" id="notice-dot"></span></button></header><div class="search-line" id="search-line" hidden><input id="route-search" aria-label="搜索示例路线" placeholder="搜索路线"><button id="search-close">取消</button></div><section class="distance"><small>本月累计里程</small><div class="distance-main"><strong>128.6km<small>⇄</small></strong><button class="record" id="record" aria-pressed="false">开始记录</button></div></section><div class="quick-actions"><button class="quick-action" id="find-routes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18m-3 12 2-6 4-1-2 6Z"/></svg>找路线</button><button class="quick-action" id="gear"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6V4h8v2M4 8h16v12H4zm0 5h16m-10-2v4h4v-4"/></svg>装备清单</button></div><div class="route-heading" id="route-heading"><h1>进行中的路线</h1><button id="all-routes">全部</button></div><div class="routes" id="routes"></div><p class="route-empty" id="route-empty" hidden>没有匹配的路线，清空搜索再试试。</p></div><nav class="hike-nav" aria-label="底部导航"><button data-nav="home" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 10 8-7 8 7v11h-6v-7h-4v7H4Z"/></svg>首页</button><button data-nav="routes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 20 7-15 5 10 3-6 4 11ZM8 10h4"/></svg>路线</button><button data-nav="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7a4 4 0 1 0 8 0 4 4 0 0 0-8 0m-4 14v-3a8 8 0 0 1 16 0v3"/></svg>我的</button></nav><aside class="notice-panel" id="notice-panel" role="dialog" aria-label="路线提醒" aria-modal="false" hidden><button class="notice-item" data-notice="route"><i></i>路线已确认 · 莫干山西线</button><button class="notice-item" data-notice="people"><i></i>同行的人加入了</button><button class="notice-item" data-notice="gear"><i></i>装备清单更新了 2 项</button></aside></section></main><div class="tools"><button id="reset">重新开始</button><label><input id="reduce" type="checkbox">减少动态效果</label><p id="state">点击铃铛红点，通知从这个位置展开；路线与记录仅本地示例。</p></div><dialog class="hike-dialog" id="detail"><h2 id="detail-title"></h2><p id="detail-copy"></p><div id="gear-items" hidden><label><input type="checkbox" data-gear="water">饮用水 1.5L</label><label><input type="checkbox" data-gear="coat">轻便雨衣</label><label><input type="checkbox" data-gear="lamp">头灯与备用电池</label></div><button id="detail-close">返回</button></dialog><script src="../task-scene.js"></script><script src="09.js"></script></html>
