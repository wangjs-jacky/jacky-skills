<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高级提示 · 八主章与前导两机制</title><style>body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#edf0ed;color:#233b2f}header{padding:15px 22px;background:white;display:flex;flex-wrap:wrap;align-items:center;gap:12px}h1{font-size:17px;margin:0}button,select,a{font:inherit;padding:8px;border:1px solid #cbd7cf;border-radius:8px;background:white;color:inherit}iframe{display:block;width:100%;height:calc(100vh - 78px);min-height:650px;border:0}@media(max-width:720px){header{padding:12px;gap:8px}h1{font-size:14px}iframe{min-height:720px}}</style><header><h1>高级提示 · 十个可操作机制</h1><select id="case" aria-label="选择效果"><option value="1">01 提示排队：先让位再交接</option><option value="2">02 可见倒计时与原路径撤销</option><option value="3">03 分组红点沿弧线返回对应行</option><option value="4">04 角标先撑宽再滚动，返回再收窄</option><option value="5">05 顶部横幅与页面同曲线让位</option><option value="6">06 整区新建面板从加号圆心长出</option><option value="7">07 未读线滚过后淡去、保留文档空间</option><option value="8">08 对应行、分组和顶部三层错序联动</option><option value="9">09 徒步首页的通知从红点原位展开</option><option value="10">10 饮食记录后的位移透明度轻提示</option></select><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label><a id="standalone" href="cases/01.html">独立打开</a></header><iframe id="demo" title="可操作自制复现"></iframe><script>const entries=["cases/01.html","cases/02.html","cases/03.html","cases/04.html","cases/05.html","cases/06.html","cases/07.html","cases/08.html","cases/09.html","meal.html"],choose=document.querySelector('#case'),frame=document.querySelector('#demo');function select(){const target=new URL(entries[+choose.value-1],location.href);target.searchParams.set('embed','1');frame.src=target.href;document.querySelector('#standalone').href=entries[+choose.value-1];history.replaceState(null,'','#'+String(choose.value).padStart(2,'0'))}choose.onchange=select;document.querySelector('#reset').onclick=()=>frame.contentWindow.postMessage({type:'reset'},'*');const prefs=()=>frame.contentWindow.postMessage({type:'motion-preference',reduced:document.querySelector('#reduce').checked},'*');document.querySelector('#reduce').onchange=prefs;frame.onload=prefs;if(+location.hash.slice(1)>=1&&+location.hash.slice(1)<=10)choose.value=+location.hash.slice(1);select();</script></html>
