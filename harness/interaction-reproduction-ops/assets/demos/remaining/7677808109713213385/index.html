<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>产品素材到视频 · 自编示例</title><style>body{margin:0;background:#faf9f5;color:#6e6654;font:13px/1.7 system-ui}header{padding:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:17px;margin:0}select,button{max-width:100%;font:inherit;padding:7px 10px;border:1px solid #ded8ca;border-radius:14px;background:white;color:inherit}a{color:inherit}iframe{display:block;width:100%;height:1150px;border:0}small{color:#a39883}</style><header><h1>把素材，接成一个故事。</h1><select id="pick" aria-label="选择示例"><option value="product-film.html">五手机错峰展开、回拢与黑圆转场</option><option value="sable-score.html">Sable弧形评分与七日趋势</option><option value="color-today.html">六色情绪、记录筛选与进度联动</option><option value="quiet-collection.html">柔色贴纸四件套与同贴纸预览</option><option value="workflow.html">产品简报、分镜表与时间轴联动</option><option value="sable-existing.html?view=home">SABLE主页与日历沿唯一既有方法</option></select><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label><a id="open" target="_blank" href="product-film.html">独立打开 ↗</a><small>五个新方法；主页/日历同款沿唯一原代码。作者执行链未取得，视觉待评价。</small></header><iframe id="demo" src="product-film.html" title="真实自编交互"></iframe><script>const f=document.querySelector("#demo"),p=document.querySelector("#pick"),r=document.querySelector("#reduce");p.onchange=()=>{f.src=p.value;document.querySelector("#open").href=p.value};document.querySelector("#reset").onclick=()=>f.contentWindow.postMessage({type:"reset"},"*");r.onchange=()=>f.contentWindow.postMessage({type:"motion-prefs",reduced:r.checked},"*");f.onload=()=>r.onchange();</script></html>
