<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sheet → Page · 保留同一张卡</title><link rel="stylesheet" href="sheet-page.css"><script defer src="controls.js"></script><script defer src="sheet-page.js"></script></head><body><main><header class="page-heading"><div><span>SHEET → PAGE / CONTINUITY</span><h1>让这张卡，直接长成下一页。</h1></div><p>先打开抽屉，再点击封面或展开对照。</p></header><section id="comparison" class="comparison" aria-label="先关再开与同面板变页对照"></section><div class="tools"><button id="open-both">打开抽屉</button><button id="expand-both">展开对照</button><button id="back">返回抽屉</button><button id="close-both">收回</button><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label><output id="state" role="status" aria-live="polite"></output></div><p class="provenance">两侧书架与灰/蓝渐变沿原画。左侧先收抽屉再开新页，右侧保留同一面板与封面、围绕中心对齐连续展开。分段时长和返回流程为拟合/补写。</p></main></body></html>
