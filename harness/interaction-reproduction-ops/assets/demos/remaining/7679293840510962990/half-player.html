<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Half · 保留播放上下文</title><link rel="stylesheet" href="half-player.css"><script defer src="controls.js"></script><script defer src="half-player.js"></script></head><body><main><header class="page-heading"><span>HALF / KEEP THE CONTEXT</span><h1>露出来的那一截。</h1><p>打开曲目，封面和播放状态仍留在原处。</p></header><div class="device-slot" id="device-slot"><section class="phone" aria-label="音乐页示例"><div class="player-app" id="player-app"><div class="status"><span>9:41</span><i></i></div><div class="album-cover"><i class="disc"></i></div><div class="waveform" aria-hidden="true"></div><div class="playback"><button id="previous-track" aria-label="上一项">‹</button><button id="play" aria-label="暂停状态示范，未提供音源" aria-pressed="true"><span></span></button><button id="next-track" aria-label="下一项">›</button></div><button id="open-queue" aria-label="打开曲目抽屉"><span class="line title-line"></span><span class="queue-symbol">≡</span></button><div id="base-tracks" class="base-tracks"></div><div class="bottom-nav"><i>▷</i><i>⌕</i><i>⋯</i></div></div><button id="half-shade" aria-label="收回曲目抽屉" tabindex="-1"></button><section id="half-sheet" role="dialog" aria-label="曲目列表" aria-hidden="true" inert><button id="sheet-grip" aria-label="拖动调整，或按空格切换半屏和上档"><i></i></button><div class="sheet-heading"><span class="line"></span></div><div id="queue" class="queue"></div></section></section></div><div class="tools"><button id="open-half">打开曲目</button><button id="upper">上档</button><button id="half">半屏</button><button id="close-sheet">收回</button><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label><output id="state" role="status" aria-live="polite"></output></div><p class="provenance">紫色封面、波形、灰条曲目与双停靠沿画面；顶边位置参考屏显52%/8%，本地按手机内容高拟合。曲目与播放仅展示状态，原片未提供音源。</p></main></body></html>
