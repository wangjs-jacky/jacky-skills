<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nested · 让前一层退后</title><link rel="stylesheet" href="nested-sheets.css"><script defer src="controls.js"></script><script defer src="nested-sheets.js"></script></head><body><main><header class="page-heading"><span>NESTED / MAKE ROOM</span><h1>多一层，就退后一点。</h1><p>第二层进来时，第一层缩小、退后、变暗。</p></header><div id="device-slot" class="device-slot"><section class="phone" aria-label="对话与嵌套抽屉"><div id="chat-app"><div class="status"><span>9:41</span><i></i></div><div class="chat-heading"><i></i><span></span></div><div class="messages" id="messages"></div><div class="composer"><i></i><span></span><button id="chat-plus" aria-label="打开第一层">+</button></div></div><button id="nested-shade" aria-label="返回上一层" tabindex="-1"></button><section id="first-sheet" class="sheet first-sheet" role="dialog" aria-label="第一层列表" aria-hidden="true" inert><button id="first-grip" class="grip" aria-label="收回第一层"><i></i></button><div class="sheet-heading"><span></span></div><div id="first-list"></div><div class="first-dim" aria-hidden="true"></div></section><section id="child-sheet" class="sheet child-sheet" role="dialog" aria-label="第二层详情" aria-hidden="true" inert><button id="child-grip" class="grip" aria-label="返回第一层"><i></i></button><div class="detail-hero" aria-hidden="true"></div><div class="detail-title"></div><div id="detail-options"></div><div id="detail-chips" class="detail-chips"></div></section></section></div><div class="tools"><button id="open-first">打开第一层</button><button id="open-child" disabled>再开一层</button><button id="back">返回一层</button><button id="close-all">全部收回</button><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label><output id="state" role="status" aria-live="polite"></output></div><p class="provenance">灰/橙对话、第一层列表与第二层渐变详情沿原画。“退了6%”是作者屏显；本地以0.94缩放拟合层次，位移/压暗/时长与返回控件均为补写。</p></main></body></html>
