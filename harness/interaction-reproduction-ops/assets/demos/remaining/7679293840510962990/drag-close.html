<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drag Close · 位移与速度</title><link rel="stylesheet" href="drag-close.css"><script defer src="controls.js"></script><script defer src="drag-close.js"></script></head><body><main><header class="page-heading"><span>DRAG CLOSE / FOLLOW THE HAND</span><h1>短短一甩，也能关。</h1><p>从抓手向下拖，慢拖和快甩会得到不同回应。</p></header><div id="device-slot" class="device-slot"><section class="phone" aria-label="黄色商品页与拖拽关闭"><div id="shop-app"><div class="status"><span>9:41</span><i></i></div><div class="app-heading"><i></i><span></span></div><div id="categories" class="categories"></div><div id="products" class="products"></div><div class="cart-bar"><i>♧</i><span></span><button id="open-cart" aria-label="打开购物列表"><i></i></button></div><div class="bottom-nav"><i>⌂</i><i>⌕</i><i>♧</i><i>♙</i></div></div><button id="close-shade" aria-label="收回列表" tabindex="-1"></button><section id="drag-sheet" role="dialog" aria-label="拖动日程样式列表" aria-hidden="true" inert><button id="drag-grip" aria-label="向下拖动关闭，或按向下键"><i></i></button><div class="sheet-heading"><span></span></div><div id="drag-list"></div></section></section></div><div class="readings" aria-label="本次手势实际读数"><span>位移 <output id="dy">0</output> px</span><span>速度 <output id="velocity">0.00</output> px/ms</span><output id="decision">等待打开</output></div><div class="tools"><button id="open-sheet">打开列表</button><button id="close-sheet">收回</button><button id="reset">复位</button><label><input id="reduce" type="checkbox">减少动态</label><output id="state" role="status" aria-live="polite"></output></div><p class="provenance">画面为简化色块商品与灰条列表。作者屏显规则：v &gt; 0.5px/ms，或 dy &gt; 90px；本地以手机内像素计算，速度窗口、几何和回位时间为拟合。</p></main></body></html>
