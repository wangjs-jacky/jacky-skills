<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>十种弹窗交互 · 自编复现</title><style>body{margin:0;background:#f2f3ed;color:#364633;font:14px/1.7 system-ui}header{padding:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}select,button{max-width:100%;font:inherit;padding:8px;border:1px solid #c4d2b6;border-radius:8px;background:white;color:inherit}a{color:inherit}iframe{display:block;width:100%;height:1100px;border:0}small{color:#6b7968}</style><header><h1>让每一层都有清楚的来路。</h1><select id="pick" aria-label="选择示例"><option value="bottom-sheet.html">底部抽屉与中心弹窗对照</option><option value="half-player.html">半屏音乐页与双停靠</option><option value="full-expand.html">同一面板无缝全屏展开</option><option value="background-retreat.html">背景压暗、模糊与轻缩</option><option value="spring-entry.html">先露出再落位的两段弹性</option><option value="drag-close.html">短距快甩与长距慢拖关闭</option><option value="snap-map.html">地图三档最近吸附与有界越界</option><option value="nested-sheets.html">第二层进入时让第一层退后</option><option value="sheet-page.html">同一张卡直接长成页面</option><option value="modal-success.html">确认条收圆、画勾与提示交接</option></select><button id="reset">复位</button><label><input type="checkbox" id="reduce">减少动态</label><a id="open" href="bottom-sheet.html" target="_blank">独立打开 ↗</a><small>十项自制复现；旁注、拟合与补写分开，视觉待评价。</small></header><iframe id="demo" src="bottom-sheet.html" title="自编交互"></iframe><script>const f=document.querySelector('#demo'),p=document.querySelector('#pick'),r=document.querySelector('#reduce');p.onchange=()=>{f.src=p.value;document.querySelector('#open').href=p.value};document.querySelector('#reset').onclick=()=>f.contentWindow.postMessage({type:'reset'},'*');r.onchange=()=>f.contentWindow.postMessage({type:'motion-prefs',reduced:r.checked},'*');f.onload=()=>r.onchange();</script></html>
